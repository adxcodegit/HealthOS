function foodsSheet(){let q='';const list=()=>{const items=S.foods.filter(f=>!q||f.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
    return items.length?`<div class="rows">${items.map(foodRow).join('')}</div>`:`<div class="inline-empty" style="padding:16px 0">${q?'No matches.':'No foods yet.'}</div>`;};
  openSheet({title:'My foods',full:true,body:`<div class="search" style="margin-bottom:8px">${I.search}<input class="input" id="dq" type="search" placeholder="Search ${S.foods.length} foods"></div><div id="dl">${list()}</div>`,
    foot:`<button class="btn primary wide" data-new>New food</button>`,
    onMount:(el,close)=>{$('#dq',el).addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();$('#dl',el).innerHTML=list();});
      el.addEventListener('click',e=>{const f=e.target.closest('[data-f]');if(f)return foodEditor(f.dataset.f,()=>{$('#dl',el).innerHTML=list();});
        if(e.target.closest('[data-new]'))foodEditor(null,()=>{$('#dl',el).innerHTML=list();});});}});}

/* ---------- saved meals ---------- */
function mealTotals(m){return m.items.reduce((t,it)=>{const f=foodById(it.foodId);if(!f)return t;const mm=foodMacros(f,it.qty);t.kcal+=mm.kcal;t.p+=mm.p;return t;},{kcal:0,p:0});}
function logSavedMeal(k,meal,m){let n=0;m.items.forEach(it=>{const f=foodById(it.foodId);if(f){logFood(k,meal,f,it.qty,null);n++;}});
  toast(n?m.name+' added to '+meal:'The foods in this meal no longer exist');}
function mealsSheet(){const rows=()=>S.meals.length?`<div class="rows">${S.meals.map(m=>{const t=mealTotals(m);return srow(m.id,`<button class="row" data-m="${m.id}"><div class="main"><div class="ttl">${esc(m.name)}</div>
    <div class="meta">${esc(m.items.map(it=>(foodById(it.foodId)||{}).name).filter(Boolean).join(', '))}</div></div><div class="end"><span class="t-val num">${fmt(t.kcal)}</span><span class="t-xs">kcal</span></div></button>`);}).join('')}</div>`
    :`<div class="empty"><div class="ttl">No saved meals</div><p class="t-sm">Open a meal's options on the Food tab and choose Save as meal.</p></div>`;
  openSheet({title:'Saved meals',body:`<div id="ml">${rows()}</div>${S.meals.length?'<p class="t-xs" style="margin-top:12px">Tap to log. Swipe left to delete.</p>':''}`,
    onMount:(el,close)=>{const onDel=id=>{S.meals=S.meals.filter(x=>x.id!==id);save();$('#ml',el).innerHTML=rows();bindSwipe(el,onDel);toast('Meal deleted');};bindSwipe(el,onDel);
      el.addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;const m=S.meals.find(x=>x.id===b.dataset.m);
        close(()=>pickMealSheet(m));});}});}
function pickMealSheet(m){openSheet({title:'Log '+m.name,body:`<p class="t-sm" style="margin:0 0 14px">Adds to ${esc(relDay(UI.date).toLowerCase()==='today'?'today':relDay(UI.date))}.</p><div class="rows">${MEALS_ALL.map(x=>`<button class="row" data-v="${x}"><div class="main"><div class="ttl">${x}</div></div>${I.chev.replace('<svg','<svg class="chev"')}</button>`).join('')}</div>`,
  onMount:(el,close)=>el.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b){logSavedMeal(UI.date,b.dataset.v,m);close();}})});}
function mealMoreSheet(k,meal){const d=dayOr(k),items=d.food.filter(e=>e.meal===meal),y=dayOr(addDays(k,-1)).food.filter(e=>e.meal===meal);
  openSheet({title:meal,body:`<div class="rows">
    <button class="row" data-a="add"><span class="ico">${I.plus}</span><div class="main"><div class="ttl">Add food</div></div></button>
    <button class="row" data-a="copy" ${y.length?'':'disabled style="opacity:.4"'}><span class="ico">${I.today}</span><div class="main"><div class="ttl">Copy from previous day</div><div class="meta">${y.length?plural(y.length,'item')+', '+fmt(sum(y,e=>e.kcal))+' kcal':'Nothing logged'}</div></div></button>
    <button class="row" data-a="save" ${items.filter(e=>e.foodId).length?'':'disabled style="opacity:.4"'}><span class="ico">${I.meal}</span><div class="main"><div class="ttl">Save as meal</div><div class="meta">Reuse this combination in one tap</div></div></button>
    <button class="row" data-a="clear" ${items.length?'':'disabled style="opacity:.4"'}><span class="ico" style="color:var(--neg)">${I.trash}</span><div class="main"><div class="ttl" style="color:var(--neg)">Clear ${meal.toLowerCase()}</div></div></button></div>`,
    onMount:(el,close)=>el.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;
      if(a==='add')return close(()=>foodSearchSheet(k,meal));
      if(a==='copy'){const dd=day(k,true);y.forEach(x=>dd.food.push(Object.assign({},x,{id:uid(),time:nowTime()})));save();render();close();return toast(plural(y.length,'item')+' copied');}
      if(a==='clear')return close(()=>undoable(meal+' cleared',()=>{const dd=day(k);dd.food=dd.food.filter(x=>x.meal!==meal);}));
      if(a==='save')close(()=>saveMealSheet(items,meal));})});}
function saveMealSheet(items,meal){openSheet({title:'Save as meal',body:`<label class="field"><span class="lbl">Name</span><input class="input" id="mn" value="${esc(meal)}"></label>
  <p class="t-xs" style="margin-top:10px">${esc(items.filter(e=>e.foodId).map(e=>e.name).join(', '))}</p>`,foot:`<button class="btn primary wide" data-save>Save meal</button>`,focus:'#mn',
  onMount:(el,close)=>$('[data-save]',el).addEventListener('click',()=>{const n=$('#mn',el).value.trim();if(!n)return toast('Name the meal');
    S.meals.push({id:uid(),name:n,meal,items:items.filter(e=>e.foodId).map(e=>({foodId:e.foodId,qty:e.qty}))});save();close();toast('Meal saved');})});}

/* ---------- weight ---------- */
function weightSheet(k){const d=day(k),b=(d&&d.body)||{},prev=lastWeigh(addDays(k,-1)),has=b.weight!=null;
  const start=has?U.w(b.weight):prev?U.w(prev.w):(U.wL()==='lb'?170:75),step=U.wL()==='lb'?.2:.1;
  openSheet({title:k===todayKey()?'Weigh-in':'Weigh-in, '+shortDate(k),body:`
    <div class="stepper"><button data-d="-1" aria-label="Less">−</button><div class="v"><input id="wv" inputmode="decimal" value="${start.toFixed(1)}" aria-label="Weight"><small>${U.wL()}</small></div><button data-d="1" aria-label="More">+</button></div>
    <p class="t-xs center" style="margin:10px 0 0;min-height:16px" id="wd"></p>
    <div class="grid2" style="margin-top:16px"><label class="field"><span class="lbl">Body fat <span class="faint">optional</span></span><div class="in-unit"><input class="input num" id="bf" inputmode="decimal" value="${b.bf!=null?b.bf:''}" placeholder="${DASH}"><span>%</span></div></label>
      <label class="field"><span class="lbl">Waist <span class="faint">optional</span></span><div class="in-unit"><input class="input num" id="ws" inputmode="decimal" value="${b.waist!=null?b.waist:''}" placeholder="${DASH}"><span>cm</span></div></label></div>`,
    foot:`<button class="btn primary wide" data-save>${has?'Save changes':'Log weight'}</button>${has?`<button class="btn danger wide" style="margin-top:4px" data-del>Delete weigh-in</button>`:''}`,
    onMount:(el,close)=>{const inp=$('#wv',el);const upd=()=>{const v=num(inp.value);$('#wd',el).textContent=prev&&v?`${signed(v-U.w(prev.w),1)} ${U.wL()} since ${shortDate(prev.k)}`:'';};upd();
      inp.addEventListener('input',upd);inp.addEventListener('focus',()=>inp.select());bindHold(el,'[data-d]',bt=>stepVal(inp,+bt.dataset.d,step,0,1));
      $('[data-save]',el).addEventListener('click',()=>{const v=num(inp.value);if(v<20)return toast('Enter a valid weight');const dd=day(k,true);
        dd.body=Object.assign({},dd.body||{},{weight:U.wIn(v)});const bf=$('#bf',el).value.trim(),ws=$('#ws',el).value.trim();
        if(bf)dd.body.bf=num(bf);else delete dd.body.bf;if(ws)dd.body.waist=num(ws);else delete dd.body.waist;
        save();render();haptic(10);close();toast(has?'Weigh-in updated':'Weight logged');});
      const del=$('[data-del]',el);if(del)del.addEventListener('click',()=>close(()=>undoable('Weigh-in deleted',()=>{const dd=day(k);dd.body=null;})));}});}

/* ---------- runs ---------- */
function runSheet(k,id){const d=day(k,true),r=id?d.runs.find(x=>x.id===id):null;let type=r?r.type||'Easy':'Easy';
  openSheet({title:r?'Edit run':'Log run',full:true,body:`<div class="form">
    <div class="grid2"><label class="field"><span class="lbl">Distance</span><div class="in-unit"><input class="input num" id="rd" inputmode="decimal" value="${r?round(U.d(r.dist),2):''}" placeholder="5.00"><span>${U.dL()}</span></div></label>
      <label class="field"><span class="lbl">Time</span><input class="input num" id="rt" inputmode="numeric" value="${r?mmss(r.dur):''}" placeholder="mm:ss"></label></div>
    <div class="card" style="background:var(--surface-2);display:flex;justify-content:space-between;align-items:center"><span class="t-sm">Pace</span><span class="t-metric num" id="rp">${DASH}</span></div>
    <div class="field"><span class="lbl">Type</span><div class="chips" id="rty">${RUN_TYPES.map(t=>`<button class="chip" data-v="${t}" aria-selected="${t===type}">${t}</button>`).join('')}</div></div>
    <div class="grid2"><label class="field"><span class="lbl">Calories <span class="faint">optional</span></span><div class="in-unit"><input class="input num" id="rk" inputmode="numeric" value="${r&&r.kcal?r.kcal:''}" placeholder="${DASH}"><span>kcal</span></div></label>
      <label class="field"><span class="lbl">Avg heart rate <span class="faint">optional</span></span><div class="in-unit"><input class="input num" id="rh" inputmode="numeric" value="${r&&r.hr?r.hr:''}" placeholder="${DASH}"><span>bpm</span></div></label></div>
    <label class="field"><span class="lbl">Notes <span class="faint">optional</span></span><textarea class="input" id="rn" placeholder="Route, how it felt">${esc(r&&r.note||'')}</textarea></label></div>`,
    foot:`<button class="btn primary wide" data-save>${r?'Save changes':'Log run'}</button>${r?`<button class="btn danger wide" style="margin-top:4px" data-del>Delete run</button>`:''}`,focus:r?null:'#rd',
    onMount:(el,close)=>{const calc=()=>{const dd=U.dIn(num($('#rd',el).value)),tt=parseDur($('#rt',el).value);$('#rp',el).innerHTML=dd>0&&tt>0?paceFmt(tt/dd)+`<span class="u">/${U.dL()}</span>`:DASH;};
      ['#rd','#rt'].forEach(s=>$(s,el).addEventListener('input',calc));calc();bindChips(el,'#rty',v=>type=v);
      $('[data-save]',el).addEventListener('click',()=>{const dd=num($('#rd',el).value),tt=parseDur($('#rt',el).value);if(dd<=0||tt<=0)return toast('Enter distance and time');
        const best=Math.max(0,...allLogged('runs').filter(x=>x.id!==(r&&r.id)).map(x=>x.dist));
        const o={dist:U.dIn(dd),dur:tt,type,kcal:num($('#rk',el).value)||null,hr:num($('#rh',el).value)||null,note:$('#rn',el).value.trim()||null};
        if(r)Object.assign(r,o);else d.runs.push(Object.assign({id:uid(),time:nowTime()},o));
        save();render();haptic(10);close();toast(!r&&o.dist>best&&best>0?'Run logged. Your longest yet.':r?'Run updated':'Run logged');});
      const del=$('[data-del]',el);if(del)del.addEventListener('click',()=>close(()=>undoable('Run deleted',()=>{d.runs=d.runs.filter(x=>x.id!==r.id);})));}});}

/* ---------- habits, challenge pillars ---------- */
function pillarTap(k,id){const p=S.challenge.pillars.find(x=>x.id===id);if(!p)return;
  if(p.src==='habit'){const hb=S.habits.find(h=>h.id===p.habitId);if(!hb)return;
    if(hb.type==='check'){const d=day(k,true);if(d.habits[hb.id])delete d.habits[hb.id];else d.habits[hb.id]=true;haptic(8);save();render();return;}
    return habitSheet(k,hb,p);}
  ({workout:()=>dayOr(k).workouts.length?go('train'):pickWorkoutSheet(),run:()=>runSheet(k),food:()=>foodSearchSheet(k),water:()=>go('food'),weight:()=>weightSheet(k)})[p.src]();}
function habitSheet(k,hb,p){const d=day(k,true),dec=hb.dec||0,tg=p&&p.min!=null?p.min:habitTarget(hb,k),cur=d.habits[hb.id];
  openSheet({title:hb.name,body:`<div class="stepper"><button data-d="-1" aria-label="Less">−</button><div class="v"><input id="hv" inputmode="decimal" value="${cur!=null?cur:(tg||0)}"><small>${esc(hb.unit||'')}${tg?(hb.unit?', ':'')+'target '+fmt(tg,dec):''}</small></div><button data-d="1" aria-label="More">+</button></div>
    ${(hb.presets||[]).length?`<div class="chips" style="margin-top:10px" id="hp">${hb.presets.map(v=>`<button class="chip num" data-v="${v}">${fmt(v,v%1?1:0)} ${esc(hb.unit||'')}</button>`).join('')}</div>`:''}`,
    foot:`<button class="btn primary wide" data-save>Save</button>${cur!=null?`<button class="btn danger wide" style="margin-top:4px" data-del>Clear</button>`:''}`,
    onMount:(el,close)=>{const inp=$('#hv',el);bindHold(el,'[data-d]',b=>stepVal(inp,+b.dataset.d,hb.step||(dec?.5:1),0,dec));
      const hp=$('#hp',el);if(hp)hp.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b){inp.value=b.dataset.v;haptic(4);}});
      $('[data-save]',el).addEventListener('click',()=>{d.habits[hb.id]=num(inp.value);save();render();close();});
      const del=$('[data-del]',el);if(del)del.addEventListener('click',()=>{delete d.habits[hb.id];save();render();close();});}});}

/* =====================================================================
   Targets
   ===================================================================== */
function targetRow(t){const n=daysLeft(t);
  if(t.done)return srow(t.id,`<button class="row done" data-t="${t.id}"><span class="ring-ok">${I.check}</span><div class="main"><div class="ttl">${esc(t.title)}</div>
    <div class="meta">Completed ${esc(shortDate(t.doneAt||t.date))}${(t.doneAt||'')<=t.date?', on time':''}</div></div>${I.chev.replace('<svg','<svg class="chev"')}</button>`);
  return srow(t.id,`<button class="row" data-t="${t.id}"><span class="ring-open">${I.target}</span><div class="main"><div class="ttl">${esc(t.title)}</div>
    <div class="meta">${esc(fullDate(t.date))}</div></div><div class="end"><span class="t-val num ${n<0?'neg':''}">${n===0?'Today':fmt(Math.abs(n))}</span>
    <span class="t-xs ${n<0?'neg':''}">${n===0?'due':n<0?'overdue':Math.abs(n)===1?'day left':'days left'}</span></div></button>`);}
function targetsSheet(){
  const body=()=>{const a=activeTargets(),d=doneTargets();
    if(!a.length&&!d.length)return `<div class="empty" style="padding-top:36px"><div class="ring-open" style="width:56px;height:56px;margin:0 auto 16px">${I.target.replace('<svg','<svg style="width:28px;height:28px"')}</div>
      <div class="ttl">Set your first target</div><p class="t-sm">Give it a name and a date, like Lose 10 kg by December 4. It counts down on your Today screen.</p></div>`;
    return (a.length?`<div class="sec-t">Active</div><div class="grouped rows">${a.map(targetRow).join('')}</div>`:`<div class="sec-t">Active</div><div class="grouped"><div class="inline-empty">No active targets.</div></div>`)+
      (d.length?`<div class="sec-t">Completed</div><div class="grouped rows">${d.map(targetRow).join('')}</div>`:'')+
      `<p class="note">${a.length?'Active targets appear on Today, soonest first. ':''}Swipe left on a target to delete it.</p>`;};
  openSheet({title:'Targets',full:true,body:`<div id="tgl">${body()}</div>`,foot:`<button class="btn primary wide" data-new>${I.plus}New target</button>`,
    onMount:(el,close)=>{const redraw=()=>{$('#tgl',el).innerHTML=body();bindSwipe(el,del);};
      const del=id=>{const t=S.targets.find(x=>x.id===id);S.targets=S.targets.filter(x=>x.id!==id);save();render();redraw();
        toast('Target deleted',{label:'Undo',fn:()=>{S.targets.push(t);save();render();redraw();}});};
      bindSwipe(el,del);
      el.addEventListener('click',e=>{const r=e.target.closest('[data-t]');if(r)return targetDetail(r.dataset.id,redraw);
        if(e.target.closest('[data-new]'))targetEditor(null,redraw);});}});}
function targetDetail(id,after){const t=S.targets.find(x=>x.id===id);if(!t)return;const n=daysLeft(t),prog=targetProgress(t);
  const hero=t.done?`<div class="tgt-hero"><span class="done-badge">${I.check}Completed</span>
      <div class="t-sm" style="margin-top:14px">Finished ${esc(fullDate(t.doneAt||todayKey()))}</div>
      <div class="t-xs" style="margin-top:4px">${(t.doneAt||'')<=t.date?'Ahead of '+esc(shortDate(t.date))+' target date':'Target date was '+esc(shortDate(t.date))}</div></div>`
    :`<div class="tgt-hero"><div class="t-hero num ${n<0?'neg':''}">${n===0?'Today':fmt(Math.abs(n))}</div>
      <div class="l ${n<0?'neg':''}">${n===0?'Due today':(Math.abs(n)===1?'day':'days')+(n<0?' overdue':' remaining')}</div>
      <div class="t-sm" style="margin-top:6px">${esc(fullDate(t.date))}</div></div>
      <div class="bar" style="margin-top:22px"><i style="width:${prog*100}%;background:${n<0?'var(--neg)':'var(--acc)'}"></i></div>
      <div style="display:flex;justify-content:space-between;margin-top:8px" class="t-xs"><span>${esc(elapsedText(t))}</span><span class="num">${Math.round(prog*100)}% of the time used</span></div>`;
  openSheet({title:t.title,body:hero,
    foot:t.done?`<button class="btn wide" data-undo>Mark as active</button><div class="btn-row" style="margin-top:6px"><button class="btn quiet" data-edit>Edit</button><button class="btn danger" data-del>Delete</button></div>`
      :`<button class="btn primary wide" data-done>${I.check}Mark as completed</button><div class="btn-row" style="margin-top:6px"><button class="btn quiet" data-edit>Edit</button><button class="btn danger" data-del>Delete</button></div>`,
    onMount:(el,close)=>{const fin=msg=>{save();render();if(after)after();close();if(msg)toast(msg);};
      const d=$('[data-done]',el);if(d)d.onclick=()=>{t.done=true;t.doneAt=todayKey();haptic([20,40,20]);fin('Target completed');};
      const u=$('[data-undo]',el);if(u)u.onclick=()=>{t.done=false;delete t.doneAt;fin('Target is active again');};
      $('[data-edit]',el).onclick=()=>close(()=>targetEditor(t.id,after));
      $('[data-del]',el).onclick=()=>close(()=>confirmSheet('Delete target','"'+t.title+'" will be removed. This cannot be undone.','Delete target',()=>{
        S.targets=S.targets.filter(x=>x.id!==t.id);save();render();if(after)after();toast('Target deleted');}));}});}
function targetEditor(id,after){const t=id?S.targets.find(x=>x.id===id):null;let date=t?t.date:addDays(todayKey(),30);
  const sugg=['Lose 5 kg','Lose 10 kg','Run 100 km','Run a sub-2 half','Bench 100 kg','Log food 30 days straight'];
  const quick=[['In 30 days',addDays(todayKey(),30)],['In 60 days',addDays(todayKey(),60)],['In 90 days',addDays(todayKey(),90)],['End of year',todayKey().slice(0,4)+'-12-31']].filter(q=>q[1]>todayKey());
  const hint=()=>{const n=daysBetween(todayKey(),date);return !date?'Choose a date':n<0?plural(-n,'day')+' ago':n===0?'Today':plural(n,'day')+' from today';};
  openSheet({title:t?'Edit target':'New target',full:true,body:`<div class="form">
    <label class="field"><span class="lbl">Target</span><input class="input" id="tgT" value="${esc(t?t.title:'')}" placeholder="Lose 10 kg" maxlength="48" autocomplete="off"></label>
    ${t?'':`<div class="chips" id="tgS" style="margin-top:10px">${sugg.map(x=>`<button class="chip" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>`}
    <label class="field"><span class="lbl">Target date</span><input class="input" id="tgD" type="date" value="${date}"></label>
    <div class="chips" id="tgQ" style="margin-top:10px">${quick.map(([l,k])=>`<button class="chip" data-v="${k}" aria-selected="${k===date}">${l}</button>`).join('')}</div>
    <p class="note" id="tgH" style="margin-top:12px">${hint()}</p>
    <div class="card" style="background:var(--surface-2);box-shadow:none;margin-top:22px" id="tgP"></div></div>`,
    foot:`<button class="btn primary wide" data-save>${t?'Save target':'Add target'}</button>`,focus:t?null:'#tgT',
    onMount:(el,close)=>{const ti=$('#tgT',el),di=$('#tgD',el);
      const prev=()=>{const n=daysBetween(todayKey(),date||todayKey());$('#tgH',el).textContent=hint();
        $('#tgP',el).innerHTML=`<div class="t-xs" style="margin-bottom:10px">Preview on Today</div><div class="tt" style="font-size:13px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ti.value.trim()||'Your target')}</div>
          <div style="display:flex;align-items:baseline;gap:8px;margin-top:8px"><span class="t-hero num" style="font-size:40px">${n===0?'Today':fmt(Math.abs(n))}</span>${n===0?'':`<span style="font-size:16px;font-weight:550">${Math.abs(n)===1?'day':'days'} ${n<0?'overdue':'remaining'}</span>`}</div>
          <div class="t-sm" style="margin-top:2px">${date?esc(fullDate(date)):''}</div>`;};
      prev();ti.addEventListener('input',prev);
      di.addEventListener('input',()=>{date=di.value;$$('#tgQ .chip',el).forEach(c=>c.setAttribute('aria-selected',c.dataset.v===date));prev();});
      const sg=$('#tgS',el);if(sg)sg.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;ti.value=b.dataset.v;haptic(4);prev();});
      bindChips(el,'#tgQ',v=>{date=v;di.value=v;prev();});
      $('[data-save]',el).addEventListener('click',()=>{const title=ti.value.trim();if(!title)return toast('Name your target');if(!date)return toast('Choose a target date');
        if(!t&&date<todayKey())return toast('Pick a date from today onward');
        if(t)Object.assign(t,{title,date});else S.targets.push({id:uid(),title,date,created:todayKey(),done:false});
        save();render();haptic(10);close(()=>{if(after)after();});toast(t?'Target saved':'Target added');});}});}

/* =====================================================================
   Workouts
   ===================================================================== */
const COMMON_EX=['Back squat','Front squat','Deadlift','Romanian deadlift','Bench press','Incline dumbbell press','Overhead press','Seated shoulder press','Pull-up','Chin-up','Lat pulldown','Barbell row','Chest supported row','Seated cable row','Dip','Leg press','Leg curl','Leg extension','Hip thrust','Walking lunge','Bulgarian split squat','Standing calf raise','Lateral raise','Face pull','Cable fly','Biceps curl','Hammer curl','Triceps rope pushdown','Skull crusher','Plank','Hanging leg raise'];
function knownExercises(){const set=new Set();S.workouts.forEach(w=>w.exercises.forEach(e=>set.add(e.name)));
  allLogged('workouts').forEach(w=>(w.exercises||[]).forEach(e=>set.add(e.name)));COMMON_EX.forEach(e=>set.add(e));return [...set];}
function lastPerf(name,excludeId){const ks=Object.keys(S.log).sort().reverse();
  for(const k of ks){const ws=S.log[k].workouts||[];for(let i=ws.length-1;i>=0;i--){const w=ws[i];if(w.id===excludeId)continue;
    const e=(w.exercises||[]).find(x=>x.name===name);if(e&&e.sets&&e.sets.length)return e.sets;}}return null;}
function bestE1(name){let b=0;Object.values(S.log).forEach(d=>(d.workouts||[]).forEach(w=>(w.exercises||[]).forEach(e=>{if(e.name===name)(e.sets||[]).forEach(s=>{b=Math.max(b,e1rm(s.w,s.r));});})));return b;}
const estMin=w=>Math.max(10,Math.round(sum(w.exercises,e=>e.sets*(45+(e.rest||90)))/60/5)*5);
const setStr=s=>{const w=U.w(s.w||0);return (w?fmt(w,round(w,1)%1?1:0)+' × ':'')+s.r;};

function pickWorkoutSheet(){if(S.session)return openSession();
  openSheet({title:'Start workout',body:(S.workouts.length?`<div class="rows">${S.workouts.map(w=>`<button class="row" data-w="${w.id}"><div class="main"><div class="ttl">${esc(w.name)}</div>
    <div class="meta">${plural(w.exercises.length,'exercise')}, about ${estMin(w)} min</div></div>${I.chev.replace('<svg','<svg class="chev"')}</button>`).join('')}</div>`:
    `<p class="t-sm" style="margin:0 0 4px">No templates yet. Start empty and add exercises as you go, or build a template to reuse.</p>`)+
    `<div class="btn-row" style="margin-top:16px"><button class="btn" data-empty>Empty workout</button><button class="btn" data-new>New template</button></div>`,
    onMount:(el,close)=>el.addEventListener('click',e=>{const b=e.target.closest('[data-w]');
      if(b){const w=S.workouts.find(x=>x.id===b.dataset.w);return close(()=>templateSheet(w.id));}
      if(e.target.closest('[data-empty]'))return close(()=>startSession({id:null,name:'Workout',exercises:[]}));
      if(e.target.closest('[data-new]'))close(()=>templateEditor(null));})});}
function templateSheet(id){const w=S.workouts.find(x=>x.id===id);if(!w)return;
  openSheet({title:w.name,body:`<p class="t-sm" style="margin:-2px 0 12px">${plural(w.exercises.length,'exercise')}, about ${estMin(w)} min</p>
    <div class="rows">${w.exercises.map(e=>{const p=lastPerf(e.name);return `<div class="row"><div class="main"><div class="ttl">${esc(e.name)}</div>
      <div class="meta">${p?'Last time '+p.map(setStr).slice(0,3).join(', '):'No history yet'}</div></div><div class="end t-val num">${e.sets} × ${e.reps}</div></div>`;}).join('')}</div>`,
    foot:`<button class="btn primary wide" data-start>${I.play}Start workout</button><div class="btn-row" style="margin-top:6px"><button class="btn quiet" data-edit>Edit</button><button class="btn danger" data-del>Delete</button></div>`,
    onMount:(el,close)=>{$('[data-start]',el).onclick=()=>close(()=>startSession(w));$('[data-edit]',el).onclick=()=>close(()=>templateEditor(w.id));
      $('[data-del]',el).onclick=()=>close(()=>undoable('Template deleted',()=>{S.workouts=S.workouts.filter(x=>x.id!==w.id);}));}});}
function templateEditor(id){const src=id&&S.workouts.find(x=>x.id===id);const w=src?JSON.parse(JSON.stringify(src)):{id:uid(),name:'',cat:'Custom',exercises:[]};
  const exRows=()=>w.exercises.length?w.exercises.map((e,i)=>`<div class="card" style="background:var(--surface-2);padding:12px 14px" data-i="${i}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><div class="t-val" style="flex:1">${esc(e.name)}</div>
        <button class="icon-btn" style="width:34px;height:34px" data-up="${i}" aria-label="Move up" ${i?'':'disabled'}>${svg('<path d="M12 19V5M6 11l6-6 6 6"/>',2)}</button>
        <button class="icon-btn" style="width:34px;height:34px;color:var(--neg)" data-rm="${i}" aria-label="Remove">${I.trash}</button></div>
      <div class="grid3">${[['sets','Sets',e.sets],['reps','Reps',e.reps],['weight',U.wL(),e.weight?round(U.w(e.weight),1):'']].map(([f,l,v])=>`<label class="field"><span class="lbl">${l}</span><input class="input num" style="min-height:42px;background:var(--surface)" data-e="${f}" inputmode="decimal" value="${v}" placeholder="${DASH}"></label>`).join('')}</div></div>`).join('')
    :`<div class="inline-empty" style="padding:8px 2px">No exercises yet.</div>`;
  openSheet({title:src?'Edit template':'New template',full:true,body:`<div class="form"><label class="field"><span class="lbl">Name</span><input class="input" id="tn" value="${esc(w.name)}" placeholder="Upper, heavy"></label>
    <div><div class="lbl t-sm" style="margin:0 2px 8px;font-weight:520">Exercises</div><div class="gap-8" id="tex">${exRows()}</div>
    <button class="btn wide" style="margin-top:10px" data-add>${I.plus}Add exercise</button></div></div>`,
    foot:`<button class="btn primary wide" data-save>${src?'Save template':'Create template'}</button>`,focus:src?null:'#tn',
    onMount:(el,close)=>{const sync=()=>$$('#tex [data-i]',el).forEach(c=>{const e=w.exercises[+c.dataset.i];$$('[data-e]',c).forEach(inp=>{const f=inp.dataset.e;
        e[f]=f==='weight'?(inp.value.trim()===''?null:U.wIn(num(inp.value))):Math.max(1,Math.round(num(inp.value)));});});
      const redraw=()=>{$('#tex',el).innerHTML=exRows();};
      el.addEventListener('click',ev=>{const T=x=>ev.target.closest(x);
        if(T('[data-add]')){sync();return exercisePicker(n=>{const p=lastPerf(n);w.exercises.push({name:n,sets:3,reps:p?p[0].r:10,weight:p?p[0].w||null:null,rest:90});redraw();});}
        const rm=T('[data-rm]');if(rm){sync();w.exercises.splice(+rm.dataset.rm,1);return redraw();}
        const up=T('[data-up]');if(up){sync();const i=+up.dataset.up;[w.exercises[i-1],w.exercises[i]]=[w.exercises[i],w.exercises[i-1]];return redraw();}
        if(T('[data-save]')){sync();w.name=$('#tn',el).value.trim();if(!w.name)return toast('Name the template');if(!w.exercises.length)return toast('Add at least one exercise');
          if(src)S.workouts[S.workouts.indexOf(src)]=w;else S.workouts.push(w);save();render();close();toast(src?'Template saved':'Template created');}});}});}
function exercisePicker(cb){let q='';const all=knownExercises();
  const list=()=>{const ql=q.toLowerCase(),items=all.filter(n=>!q||n.toLowerCase().includes(ql)).sort((a,b)=>a.localeCompare(b));
    return (q&&!all.some(n=>n.toLowerCase()===ql)?`<button class="btn wide" style="margin-bottom:10px" data-n="${esc(q)}">${I.plus}Add "${esc(q)}"</button>`:'')+
      `<div class="rows">${items.map(n=>`<button class="row" style="min-height:48px" data-n="${esc(n)}"><div class="main"><div class="ttl">${esc(n)}</div></div></button>`).join('')}</div>`;};
  openSheet({title:'Add exercise',full:true,body:`<div class="search" style="margin-bottom:10px">${I.search}<input class="input" id="xq" type="search" placeholder="Search or type a new exercise"></div><div id="xl">${list()}</div>`,
    onMount:(el,close)=>{$('#xq',el).addEventListener('input',e=>{q=e.target.value.trim();$('#xl',el).innerHTML=list();});
      el.addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(b){const n=b.dataset.n;close(()=>cb(n));}});}});}
function workoutDetail(k,id){const w=dayOr(k).workouts.find(x=>x.id===id);if(!w)return;const vol=volumeOf(w);
  openSheet({title:w.name,body:`<p class="t-sm" style="margin:-2px 0 16px">${esc(longDate(k))}${w.start?', '+esc(w.start):''}</p>
    <div class="stats">${stat('Duration',w.duration?durWords(w.duration):DASH)}${stat('Sets',fmt(setsOf(w)))}${stat('Volume',fmt(U.w(vol)),U.wL())}</div>
    ${(w.prs||[]).length?`<div class="card" style="background:var(--acc-soft);margin-top:16px;padding:12px 14px"><div class="t-val" style="color:var(--acc)">New records</div><div class="t-sm">${esc(w.prs.join(', '))}</div></div>`:''}
    <div class="rows" style="margin-top:12px">${(w.exercises||[]).map(e=>`<div class="row" style="align-items:flex-start"><div class="main"><div class="ttl">${esc(e.name)}</div>
      <div class="meta num" style="white-space:normal">${(e.sets||[]).map(setStr).join(', ')}</div></div></div>`).join('')}</div>
    ${w.note?`<p class="t-sm" style="margin-top:12px">${esc(w.note)}</p>`:''}`,
    foot:`<button class="btn danger wide" data-del>Delete workout</button>`,
    onMount:(el,close)=>$('[data-del]',el).onclick=()=>close(()=>undoable('Workout deleted',()=>{const d=day(k);d.workouts=d.workouts.filter(x=>x.id!==id);}))});}

/* ---------- live session ---------- */
function sessEx(name,sets,reps,weight,rest){const prev=lastPerf(name);
  return {name,rest:rest||90,prev:prev?prev.map(s=>({w:s.w,r:s.r})):null,best:bestE1(name),
    sets:Array.from({length:Math.max(1,sets||3)},(_,j)=>{const p=prev&&(prev[j]||prev[prev.length-1]);return {w:p?p.w:(weight||0),r:p?p.r:(reps||10),done:false};})};}
function startSession(w){const t=nowTime();
  S.session={id:uid(),workoutId:w.id,name:w.name,date:todayKey(),start:Date.now(),startT:t,note:'',rest:null,
    exercises:w.exercises.map(e=>sessEx(e.name,e.sets,e.reps,e.weight,e.rest)),timeline:[{t,label:'Started'}]};
  if(w.id)S.recent.workout=w.id;persist();haptic(12);openSession();}
let sessTick=null,actx=null;
function openSession(){const s=S.session;if(!s)return;let el=$('.session');
  if(!el){el=document.createElement('div');el.className='session';document.body.appendChild(el);
    const rest=document.createElement('div');rest.className='rest';rest.id='rest';document.body.appendChild(rest);
    el.addEventListener('click',sessionClick);rest.addEventListener('click',sessionClick);
    el.addEventListener('input',e=>{const i=e.target.closest('[data-in]');if(!i)return;const [a,b,f]=i.dataset.in.split(':'),st=S.session.exercises[+a].sets[+b];
      if(f==='w')st.w=U.wIn(num(i.value));else st.r=Math.round(num(i.value));save();});
    el.addEventListener('focusin',e=>{if(e.target.matches('[data-in]'))e.target.select();});}
  $('#tabbar').classList.add('away');drawSession();clearInterval(sessTick);sessTick=setInterval(tickSession,500);tickSession();}
function drawSession(){const s=S.session,el=$('.session');if(!s||!el)return;const sy=$('.s-body',el)?$('.s-body',el).scrollTop:0;
  const done=sum(s.exercises,e=>e.sets.filter(x=>x.done).length),tot=sum(s.exercises,e=>e.sets.length);
  el.innerHTML=`<div class="s-top"><button class="icon-btn" data-s="min" aria-label="Minimise">${svg('<path d="M6 9l6 6 6-6"/>',2)}</button>
    <div class="mid"><div class="t-val">${esc(s.name)}</div><div class="t-xs num" id="sClock">0:00</div></div>
    <button class="btn sm primary" data-s="finish">Finish</button></div>
    <div style="max-width:var(--maxw);width:100%;margin:0 auto;padding:0 var(--gut)"><div class="bar thin"><i style="width:${tot?done/tot*100:0}%;background:var(--pos)"></i></div></div>
    <div class="s-body">${s.exercises.length?'':`<div class="empty" style="padding-top:48px"><div class="ttl">Empty workout</div><p class="t-sm">Add exercises as you go. Your previous sets fill in automatically.</p></div>`}
    ${s.exercises.map((e,i)=>`<div class="card flush ex"><div class="ex-h"><div class="t-val">${esc(e.name)}</div><button class="icon-btn" style="width:34px;height:34px;margin-right:-8px" data-s="exmore" data-i="${i}" aria-label="Exercise options">${I.more}</button></div>
      <div class="sets"><div class="set hd"><span>Set</span><span>Previous</span><span>${U.wL()}</span><span>Reps</span><span></span></div>
      ${e.sets.map((x,j)=>{const p=e.prev&&e.prev[j];return `<div class="set ${x.done?'done':''}"><span class="n">${j+1}</span><span class="prev num">${p?setStr(p):DASH}</span>
        <input data-in="${i}:${j}:w" inputmode="decimal" value="${x.w?round(U.w(x.w),1):''}" placeholder="0" aria-label="Weight, set ${j+1}">
        <input data-in="${i}:${j}:r" inputmode="numeric" value="${x.r||''}" placeholder="0" aria-label="Reps, set ${j+1}">
        <button class="ck" data-s="done" data-i="${i}" data-j="${j}" aria-label="Complete set ${j+1}" aria-pressed="${!!x.done}">${I.check}</button></div>`;}).join('')}
      <button class="btn sm quiet" style="margin:4px 0 0 4px" data-s="addset" data-i="${i}">${I.plus}Add set</button></div></div>`).join('')}
    <button class="btn wide" style="margin-top:16px" data-s="addex">${I.plus}Add exercise</button>
    <button class="btn wide danger" style="margin-top:8px" data-s="discard">Discard workout</button></div>`;
  $('.s-body',el).scrollTop=sy;drawRest();}
function drawRest(){const s=S.session,r=$('#rest');if(!r)return;const on=s&&s.rest&&s.rest.end>Date.now();r.classList.toggle('on',!!on);
  if(!on)return;const left=(s.rest.end-Date.now())/1000;
  r.innerHTML=`<div class="in"><div><div class="t-xs">Rest</div><div class="clock num" id="rClock">${mmss(left)}</div></div>
    <div class="bar"><i id="rBar" style="width:${clamp(left/s.rest.dur*100,0,100)}%;background:var(--acc);transition:width .5s linear"></i></div>
    <button class="btn sm" data-s="rest-" aria-label="Subtract 15 seconds">−15</button><button class="btn sm" data-s="rest+" aria-label="Add 15 seconds">+15</button><button class="btn sm primary" data-s="skip">Skip</button></div>`;}
function tickSession(){const s=S.session;if(!s){clearInterval(sessTick);return;}const c=$('#sClock');if(c)c.textContent=mmss((Date.now()-s.start)/1000);
  if(s.rest){const left=(s.rest.end-Date.now())/1000;
    if(left<=0){s.rest=null;save();haptic([40,60,40]);beep();drawRest();}
    else{const rc=$('#rClock'),rb=$('#rBar');if(rc)rc.textContent=mmss(left);else drawRest();if(rb)rb.style.width=clamp(left/s.rest.dur*100,0,100)+'%';}}}
function ensureAudio(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
function beep(){if(!actx)return;try{[0,.22].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);
  g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.15,actx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.16);
  o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.18);});}catch(e){}}
function sessionClick(e){const b=e.target.closest('[data-s]');if(!b)return;const s=S.session,a=b.dataset.s,i=+b.dataset.i;
  if(a==='done'){ensureAudio();const x=s.exercises[i].sets[+b.dataset.j];x.done=!x.done;haptic(x.done?12:6);
    if(x.done){if(!x.r){x.done=false;return toast('Enter reps first');}const r=s.exercises[i].rest||90;s.rest={end:Date.now()+r*1000,dur:r};}
    save();drawSession();return;}
  if(a==='addset'){const ss=s.exercises[i].sets,l=ss[ss.length-1]||{w:0,r:10};ss.push({w:l.w,r:l.r,done:false});save();return drawSession();}
  if(a==='addex')return exercisePicker(n=>{s.exercises.push(sessEx(n,3,10,0,90));save();drawSession();setTimeout(()=>{const bd=$('.s-body');bd&&bd.scrollTo({top:bd.scrollHeight,behavior:'smooth'});},50);});
  if(a==='exmore')return openSheet({title:s.exercises[i].name,body:`<div class="rows">
      <button class="row" data-x="rmset"><div class="main"><div class="ttl">Remove last set</div></div></button>
      <button class="row" data-x="rest"><div class="main"><div class="ttl">Rest time</div><div class="meta">${s.exercises[i].rest||90} seconds</div></div></button>
      <button class="row" data-x="rm"><div class="main"><div class="ttl" style="color:var(--neg)">Remove exercise</div></div></button></div>`,
    onMount:(el,close)=>el.addEventListener('click',ev=>{const x=ev.target.closest('[data-x]');if(!x)return;const ex=s.exercises[i];
      if(x.dataset.x==='rmset'){if(ex.sets.length>1)ex.sets.pop();}
      if(x.dataset.x==='rm')s.exercises.splice(i,1);
      if(x.dataset.x==='rest'){const opts=[60,90,120,150,180,240];ex.rest=opts[(opts.indexOf(ex.rest||90)+1)%opts.length];save();$('.meta',x).textContent=ex.rest+' seconds';return;}
      save();drawSession();close();})});
  if(a==='rest+'||a==='rest-'){s.rest.end+=(a==='rest+'?15:-15)*1000;s.rest.dur=Math.max(s.rest.dur,(s.rest.end-Date.now())/1000);save();return tickSession();}
  if(a==='skip'){s.rest=null;save();return drawRest();}
  if(a==='min')return closeSession();
  if(a==='discard')return confirmSheet('Discard workout','Nothing from this session will be saved.','Discard workout',()=>{S.session=null;persist();closeSession();toast('Workout discarded');});
  if(a==='finish')return finishSession();}
function finishSession(){const s=S.session,logged=s.exercises.map(e=>({name:e.name,best:e.best,sets:e.sets.filter(x=>x.done)})).filter(e=>e.sets.length);
  if(!logged.length)return toast('Complete at least one set first');
  const t=nowTime();s.timeline.push({t,label:'Finished'});
  const prs=logged.filter(e=>e.best>0&&Math.max(...e.sets.map(x=>e1rm(x.w,x.r)))>e.best).map(e=>e.name);
  const rec={id:s.id,workoutId:s.workoutId,name:s.name,start:s.startT,end:t,duration:Math.round((Date.now()-s.start)/1000),note:s.note||null,prs,
    exercises:logged.map(e=>({name:e.name,sets:e.sets.map(x=>({w:x.w,r:x.r}))})),timeline:s.timeline};
  day(s.date,true).workouts.push(rec);const tpl=S.workouts.find(w=>w.id===s.workoutId);
  S.session=null;persist();haptic([30,60,30]);closeSession();UI.date=rec&&s.date;if(UI.tab!=='today'&&UI.tab!=='train')go('today');else render();
  openSheet({title:'Workout saved',body:`<p class="t-sm" style="margin:-2px 0 16px">${esc(rec.name)}</p>
    <div class="stats">${stat('Duration',durWords(rec.duration))}${stat('Sets',fmt(setsOf(rec)))}${stat('Volume',fmt(U.w(volumeOf(rec))),U.wL())}</div>
    ${prs.length?`<div class="card" style="background:var(--acc-soft);margin-top:16px;padding:12px 14px"><div class="t-val" style="color:var(--acc)">${plural(prs.length,'new record')}</div><div class="t-sm">${esc(prs.join(', '))}</div></div>`:''}`,
    foot:`${tpl?`<button class="btn wide" data-tpl>Update template with today's weights</button>`:''}<button class="btn primary wide" style="margin-top:${tpl?6:0}px" data-close2>Done</button>`,
    onMount:(el,close)=>{$('[data-close2]',el).onclick=()=>close();const b=$('[data-tpl]',el);
      if(b)b.onclick=()=>{rec.exercises.forEach(e=>{const te=tpl.exercises.find(x=>x.name===e.name);if(te){const top=e.sets.reduce((a,c)=>(c.w||0)>=(a.w||0)?c:a);te.weight=top.w||null;te.reps=top.r;}});save();close();toast('Template updated');};}});}
function closeSession(){clearInterval(sessTick);$('#tabbar').classList.remove('away');const el=$('.session'),r=$('#rest');if(el)el.remove();if(r)r.remove();render();}

/* =====================================================================
   Settings
   ===================================================================== */

  const inp=(id,l,v,unit,ph)=>`<label class="field"><span class="lbl">${l}</span><div class="in-unit"><input class="input num" id="${id}" inputmode="decimal" value="${v==null?'':v}" placeholder="${ph||''}"><span>${unit}</span></div></label>`;
  openSheet({title:'Settings',full:true,body:`

      <div class="meta">${(()=>{const a=activeTargets().length,d=doneTargets().length;return a||d?plural(a,'active target')+(d?', '+d+' completed':''):'Set a goal with a date to count down to';})()}</div></div>${I.chev.replace('<svg','<svg class="chev"')}</button></div>
    <div class="grp-h">Daily nutrition</div>
    <div class="form">${inp('sK','Calories',t.kcal,'kcal')}
      <div class="grid3">${inp('sP','Protein',t.protein,'g')}${inp('sC','Carbs',t.carbs,'g')}${inp('sF','Fat',t.fat,'g')}</div>
      <p class="t-xs" id="sMac" style="margin-top:8px"></p>${inp('sW','Water',round(t.water/1000,2),'L')}</div>
    <div class="grp-h">Weight and race</div>
    <div class="form">${inp('gW','Goal weight',g.weight?round(U.w(g.weight),1):'',U.wL(),'Optional')}
      <label class="field"><span class="lbl">Race <span class="faint">optional</span></span><input class="input" id="gRn" value="${esc(g.raceName||'')}" placeholder="Half marathon"></label>
      <div class="grid2"><label class="field"><span class="lbl">Race date</span><input class="input" id="gRd" type="date" value="${g.raceDate||''}"></label>
        ${inp('gRk','Distance',g.raceDist?round(U.d(g.raceDist),2):'',U.dL())}</div>
      <label class="field"><span class="lbl">Goal time</span><input class="input num" id="gRt" inputmode="numeric" value="${g.raceTime?mmss(g.raceTime):''}" placeholder="h:mm:ss"></label></div>
    <div class="grp-h">Units and appearance</div>
    <div class="form"><div class="field"><span class="lbl">Weight</span>${seg('uw',[['kg','Kilograms'],['lb','Pounds']],u.weight)}</div>
      <div class="field"><span class="lbl">Distance</span>${seg('ud',[['km','Kilometres'],['mi','Miles']],u.dist)}</div>
      <div class="field"><span class="lbl">Appearance</span>${seg('th',[['system','System'],['light','Light'],['dark','Dark']],S.settings.theme||'system')}</div></div>
    ${S.challenge?`<div class="grp-h">Challenge</div><div class="grouped rows">
      <button class="row" style="background:transparent" data-x="chal"><div class="main"><div class="ttl">${esc(S.challenge.name)}</div><div class="meta">${S.settings.hideChallenge?'Hidden from Today':'Shown on Today'}, day ${clamp(chalDay(todayKey()),0,S.challenge.days)} of ${S.challenge.days}</div></div><span class="link">${S.settings.hideChallenge?'Show':'Hide'}</span></button></div>`:''}
    <div class="grp-h">Data</div>
    <div class="btn-row"><button class="btn" data-x="export">Export backup</button><button class="btn" data-x="import">Restore</button></div>
    <p class="note" style="margin-bottom:12px">Everything is stored on this device only. Export a backup now and then.</p><input type="file" id="imp" accept="application/json,.json" hidden>
    ${S.demo&&(S.demoDays||[]).length?`<button class="btn wide" style="margin-top:8px" data-x="demo">Remove sample data</button>`:''}
    <button class="btn danger wide" style="margin-top:8px" data-x="erase">Erase all data</button>
    <p class="t-xs center" style="margin-top:24px;color:var(--ink-3)">Health OS 4</p>`,
    foot:`<button class="btn primary wide" data-x="save">Save settings</button>`,
    onMount:(el,close)=>{placeThumbs(el);const v=id=>$('#'+id,el).value.trim();
      const mac=()=>{const k=num(v('sK')),m=num(v('sP'))*4+num(v('sC'))*4+num(v('sF'))*9,d=m-k;
        $('#sMac',el).textContent=`Macros add up to ${fmt(m)} kcal`+(k&&Math.abs(d)>50?`, ${fmt(Math.abs(d))} ${d>0?'over':'under'} your calorie target.`:'.');};
      el.addEventListener('input',mac);mac();
      let uw=u.weight,ud=u.dist;bindSeg(el,'uw',x=>uw=x);bindSeg(el,'ud',x=>ud=x);
      bindSeg(el,'th',x=>{S.settings.theme=x;applyTheme();save();});
      el.addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(!b)return;const a=b.dataset.x;
        if(a==='save'){const k=num(v('sK'));if(k<800)return toast('Set a calorie target above 800');
          Object.assign(t,{kcal:k,protein:num(v('sP')),carbs:num(v('sC')),fat:num(v('sF')),water:Math.round(num(v('sW'))*1000)||3000});
          /* read goal fields in the units shown, then switch units */
          const gw=num(v('gW')),rk=num(v('gRk'));g.weight=gw?U.wIn(gw):null;g.raceName=v('gRn');g.raceDate=v('gRd')||null;g.raceDist=rk?U.dIn(rk):null;
          g.raceTime=v('gRt')?parseDur(v('gRt')):null;u.weight=uw;u.dist=ud;save();render();close();toast('Settings saved');}
        if(a==='targets')return targetsSheet();
        if(a==='chal'){S.settings.hideChallenge=!S.settings.hideChallenge;save();render();close();}
        if(a==='export')exportData();
        if(a==='import')$('#imp',el).click();
        if(a==='demo')close(()=>confirmSheet('Remove sample data','The 45 demo days are removed. Your foods and templates stay.','Remove sample data',()=>{(S.demoDays||[]).forEach(k=>delete S.log[k]);S.demo=false;S.demoDays=[];persist();render();toast('Sample data removed');}));
        if(a==='erase')close(()=>confirmSheet('Erase all data','Every logged day, food, template and setting on this device is deleted. Export a backup first if you might want it.','Erase everything',()=>{S=DEFAULTS();S.foods=starterFoods();persist();UI.date=todayKey();applyTheme();render();toast('All data erased');}));});
      $('#imp',el).addEventListener('change',e=>importData(e.target.files[0],close));}});}
function exportData(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='health-os-'+todayKey()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exported');}
function importData(file,close){if(!file)return;const r=new FileReader();r.onerror=()=>toast('That file could not be read');
  r.onload=()=>{let data;try{data=JSON.parse(r.result);}catch(e){return toast('That file is not a valid backup');}
    if(!data||typeof data!=='object'||!data.log)return toast('That file has no logged days in it');
    close(()=>confirmSheet('Restore backup','This replaces everything on this device with the backup'+(data.savedAt?' from '+new Date(data.savedAt).toLocaleDateString():'')+'.','Replace my data',()=>{
      S=hydrate(data);persist();applyTheme();UI.date=todayKey();render();toast('Backup restored');}));};r.readAsText(file);}
function applyTheme(){const t=S.settings.theme;if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;}

/* starter foods for a fresh install: common staples with standard label values */
function starterFoods(){return [['Chicken breast',100,'g',165,31,0,3.6,0],['Eggs, whole',50,'g',72,6.3,.4,4.8,0],['Egg whites',100,'g',52,11,.7,.2,0],
  ['Paneer',100,'g',296,18.3,3.6,23,0],['Greek yoghurt',100,'g',97,9,3.6,5,0],['Curd / dahi',100,'g',61,3.5,4.7,3.3,0],['Toned milk',250,'ml',145,8,12,7.5,0],
  ['Whey protein',30,'g',120,24,3,1.5,0],['Oats, dry',50,'g',190,6.6,32,3.4,5],['Basmati rice, cooked',150,'g',195,4,42,.6,.9],['Roti / chapati',45,'g',120,3.5,20,3,2.5],
  ['Dal, cooked',150,'g',175,9.5,25,3,6.5],['Rajma, cooked',150,'g',200,12,32,1,11],['Poha',150,'g',250,4.5,45,6,2],['Idli',2,'pc',116,3.6,24,.6,1.2],
  ['Mixed vegetable sabzi',150,'g',160,4,14,10,4.5],['Salmon',100,'g',208,20,0,13,0],['Tofu',100,'g',76,8,1.9,4.8,.3],['Banana',118,'g',105,1.3,27,.4,3.1],
  ['Apple',180,'g',95,.5,25,.3,4.4],['Almonds',28,'g',164,6,6,14,3.5],['Peanut butter',32,'g',188,8,6,16,1.9],['Olive oil',10,'ml',88,0,0,10,0],
  ['Ghee',10,'g',90,0,0,10,0],['Brown bread',35,'g',88,4,15,1.1,2.2],['Black coffee',240,'ml',2,.3,0,0,0],['Masala chai',150,'ml',105,3,12,5,0],['Sweet potato, cooked',150,'g',135,2.4,31,.2,4.5]]
  .map(a=>({id:uid(),name:a[0],serving:a[1],unit:a[2],kcal:a[3],p:a[4],c:a[5],f:a[6],fib:a[7],sugar:0,sodium:0,fav:false,uses:0,lastQty:null}));}

/* =====================================================================
   Boot
   ===================================================================== */
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheets.length)return closeTop();
  if(e.target.matches('input,textarea')||sheets.length||$('.session'))return;
  if(['today','food'].includes(UI.tab)){if(e.key==='ArrowLeft')shiftDay(-1);if(e.key==='ArrowRight')shiftDay(1);}});
window.addEventListener('pagehide',persist);
window.addEventListener('resize',()=>{placeThumbs(document);placeTabInd(true);});
/* countdowns and 'today' roll over at midnight even if the app stays open */
(function midnight(){const n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1,0,0,5);setTimeout(()=>{if(UI.date===addDays(todayKey(),-1))UI.date=todayKey();UI.lastSeen=todayKey();render();midnight();},m-n);})();
document.addEventListener('visibilitychange',()=>{if(document.hidden)return persist();
  if(UI.lastSeen&&UI.lastSeen!==todayKey()&&UI.date===UI.lastSeen){UI.date=todayKey();render();}UI.lastSeen=todayKey();if(S.session)tickSession();});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>placeThumbs(document));
(async function init(){const saved=await loadState();
  if(saved&&saved.log)S=hydrate(saved);else{S=DEFAULTS();S.foods=starterFoods();persist();}
  UI.lastSeen=todayKey();applyTheme();buildTabs();render(true);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{placeThumbs(document);placeTabInd(true);});
  if(S.session)openSession();})();

</script>
