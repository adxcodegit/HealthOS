/* =====================================================================
   Design system v4
   Type: system UI on Apple devices (SF Pro), rounded numerals for data,
   Google Sans Flex as the fallback elsewhere.
   ===================================================================== */
:root{
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text",'GSF',"Helvetica Neue",Arial,sans-serif;
  --f-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,'GSF',sans-serif;
  --r-card:22px; --r-ctl:12px; --r-sheet:28px;
  --gut:20px; --maxw:520px;
  --ease:cubic-bezier(.32,.72,0,1);          /* sheets, large moves */
  --spring:cubic-bezier(.34,1.36,.64,1);     /* small overshoot for selection */
  --out:cubic-bezier(.2,.8,.2,1);
  --bar-h:64px; --bar-gap:max(calc(env(safe-area-inset-bottom,0px) - 6px),14px);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --hair:.5px;
}
@media (max-resolution:1dppx){:root{--hair:1px}}
:root,:root[data-theme="light"]{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#F2F2F7; --sunken:rgba(118,118,128,.12);
  --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.2);
  --line:rgba(60,60,67,.16); --line-2:rgba(60,60,67,.26);
  --ink:#000000; --ink-2:rgba(60,60,67,.62); --ink-3:rgba(60,60,67,.36); --on-ink:#FFFFFF;
  --acc:#0A7AFF; --acc-soft:rgba(10,122,255,.1);
  --pos:#28B351; --neg:#FF3B30;
  --p:#FF2D55; --c:#FF9500; --fat:#5856D6;
  --track:rgba(118,118,128,.14);
  --press:rgba(0,0,0,.04);
  --mat:rgba(255,255,255,.74); --mat-line:rgba(0,0,0,.06);
  --sh-card:0 .5px 1px rgba(0,0,0,.04),0 2px 12px rgba(0,0,0,.035);
  --sh-float:0 10px 30px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.06);
  --sh-sheet:0 -10px 40px rgba(0,0,0,.10);
  --scrim:rgba(0,0,0,.24);
  --thumb:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --sunken:rgba(118,118,128,.24);
    --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.34);
    --line:rgba(84,84,88,.6); --line-2:rgba(235,235,245,.22);
    --ink:#FFFFFF; --ink-2:rgba(235,235,245,.62); --ink-3:rgba(235,235,245,.32); --on-ink:#000000;
    --acc:#2F8FFF; --acc-soft:rgba(47,143,255,.16);
    --pos:#32D158; --neg:#FF453A;
    --p:#FF375F; --c:#FF9F0A; --fat:#6E6CF0;
    --track:rgba(118,118,128,.26);
    --press:rgba(255,255,255,.06);
    --mat:rgba(36,36,38,.72); --mat-line:rgba(255,255,255,.09);
    --sh-card:none; --sh-float:0 10px 30px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
    --sh-sheet:0 -10px 40px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.5); --thumb:#636366;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --sunken:rgba(118,118,128,.24);
  --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.34);
  --line:rgba(84,84,88,.6); --line-2:rgba(235,235,245,.22);
  --ink:#FFFFFF; --ink-2:rgba(235,235,245,.62); --ink-3:rgba(235,235,245,.32); --on-ink:#000000;
  --acc:#2F8FFF; --acc-soft:rgba(47,143,255,.16);
  --pos:#32D158; --neg:#FF453A;
  --p:#FF375F; --c:#FF9F0A; --fat:#6E6CF0;
  --track:rgba(118,118,128,.26);
  --press:rgba(255,255,255,.06);
  --mat:rgba(36,36,38,.72); --mat-line:rgba(255,255,255,.09);
  --sh-card:none; --sh-float:0 10px 30px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  --sh-sheet:0 -10px 40px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.5); --thumb:#636366;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.38;
  letter-spacing:-.011em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overscroll-behavior-y:none}
input,button,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-user-select:none;user-select:none}
svg{display:block}
::-webkit-scrollbar{width:0;height:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- layout ---------- */
#app{max-width:var(--maxw);margin:0 auto;padding:calc(var(--sat) + 8px) var(--gut) calc(var(--bar-h) + var(--bar-gap) + 40px)}
.view{animation:viewIn .34s var(--out) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- type scale: 12 / 13 / 15 / 16 / 20 / 32, numerals rounded ---------- */
.t-title{font-size:32px;line-height:1.12;font-weight:700;letter-spacing:-.025em}
.t-h{font-size:20px;line-height:1.25;font-weight:680;letter-spacing:-.022em}
.t-body{font-size:16px;line-height:1.4}
.t-sm{font-size:14px;line-height:1.38;color:var(--ink-2);letter-spacing:-.006em}
.t-xs{font-size:12.5px;line-height:1.3;color:var(--ink-2);font-weight:500;letter-spacing:0}
.t-hero{font-family:var(--f-num);font-size:44px;line-height:1;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.t-metric{font-family:var(--f-num);font-size:22px;line-height:1.15;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.t-val{font-size:16px;font-weight:600;letter-spacing:-.015em}
.u{font-family:var(--f);font-size:13px;font-weight:500;color:var(--ink-2);letter-spacing:0;margin-left:3px}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.pos{color:var(--pos)}.neg{color:var(--neg)}

/* ---------- large title header + compact nav bar ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;min-height:52px;margin:10px 0 20px;gap:12px}
.top .date-btn{display:flex;flex-direction:column;align-items:flex-start;border-radius:12px;padding:2px 6px;margin:-2px -6px;transition:opacity .2s}
.top .date-btn:active{opacity:.55}
.top .sub{font-size:15px;color:var(--ink-2);margin-top:1px;font-weight:500;letter-spacing:-.01em;order:-1}
.top .acts{display:flex;gap:8px;align-items:center;padding-bottom:4px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);transition:transform .25s var(--out),background .2s,opacity .2s}
.icon-btn:active{transform:scale(.9);background:var(--press)}
.icon-btn svg{width:20px;height:20px}
.icon-btn[disabled]{opacity:.28;pointer-events:none}
.top .icon-btn{width:38px;height:38px;background:var(--surface);box-shadow:var(--sh-card)}
.top .icon-btn svg{width:18px;height:18px}
.pair{display:flex;background:var(--surface);border-radius:999px;box-shadow:var(--sh-card);height:38px;align-items:center}
.pair .icon-btn{background:transparent;box-shadow:none;width:40px}
.pair i{width:var(--hair);height:18px;background:var(--line)}
.nav{position:fixed;top:0;left:0;right:0;z-index:25;padding-top:var(--sat);pointer-events:none;
  background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:var(--hair) solid transparent;opacity:0;transition:opacity .22s ease,border-color .22s}
.nav .in{height:44px;display:grid;place-items:center;font-size:17px;font-weight:600;letter-spacing:-.02em;transform:translateY(4px);transition:transform .3s var(--out)}
.nav.on{opacity:1;border-bottom-color:var(--line)}
.nav.on .in{transform:none}

/* ---------- sections & cards ---------- */
.sec{margin-top:32px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 12px}
.link{color:var(--acc);font-size:15px;font-weight:500;padding:6px 2px;margin:-6px -2px;border-radius:8px;transition:opacity .2s}
.link:active{opacity:.4}
.card{background:var(--surface);border-radius:var(--r-card);padding:18px;box-shadow:var(--sh-card)}
.card.flush{padding:0;overflow:hidden}
.gap-8>*+*{margin-top:8px}.gap-12>*+*{margin-top:12px}

/* inset-grouped rows, separators inset like a native list */
.rows>*+*{position:relative}
.rows>*+*::before{content:"";position:absolute;top:0;left:18px;right:0;height:var(--hair);background:var(--line);z-index:2;pointer-events:none}
.rows>*+*:has(.ico)::before{left:66px}
.row{display:flex;align-items:center;gap:14px;min-height:60px;padding:11px 18px;width:100%;background:var(--surface);transition:background .25s}
button.row:active,.row.tap:active{background:var(--press);transition:none}
.row .main{flex:1;min-width:0}
.row .ttl{font-size:16px;font-weight:500;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:13.5px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:right;flex-shrink:0}
.row .end .t-val{display:block;font-family:var(--f-num)}
.chev{color:var(--ink-3);width:14px;height:14px;flex-shrink:0}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--fill);color:var(--ink);flex-shrink:0}
.ico svg{width:18px;height:18px}

/* swipe to delete */
.srow{position:relative;overflow:hidden}
.srow .del{visibility:hidden;position:absolute;right:0;top:0;bottom:0;width:88px;background:var(--neg);color:#fff;font-weight:600;font-size:15px;display:grid;place-items:center}
.srow.sw .del{visibility:visible}
.srow>.row{position:relative;z-index:1;touch-action:pan-y;will-change:transform}
.srow.anim>.row{transition:transform .38s var(--ease)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;
  font-size:16px;font-weight:600;letter-spacing:-.015em;background:var(--fill);color:var(--acc);transition:transform .3s var(--out),opacity .2s,background .2s}
.btn:active{transform:scale(.97);opacity:.8;transition:transform .08s,opacity .08s}
.btn.primary{background:var(--acc);color:#fff}
.btn.accent{background:var(--acc);color:#fff}
.btn.quiet{background:transparent;color:var(--acc)}
.btn.danger{background:transparent;color:var(--neg)}
.btn.wide{width:100%}
.btn.sm{min-height:34px;padding:0 14px;font-size:15px;border-radius:999px;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn-row{display:flex;gap:10px}.btn-row>.btn{flex:1;min-width:0;padding:0 12px;white-space:nowrap}

/* segmented control */
.seg{display:flex;background:var(--sunken);border-radius:10px;padding:2px;position:relative}
.seg button{flex:1;min-height:32px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink);position:relative;z-index:1;text-align:center;transition:font-weight .1s}
.seg button[aria-selected="true"]{font-weight:600}
.seg button+button::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:var(--hair);background:var(--line-2);transition:opacity .2s}
.seg button[aria-selected="true"]::before,.seg button[aria-selected="true"]+button::before{opacity:0}
.seg .thumb{position:absolute;top:2px;bottom:2px;border-radius:8px;background:var(--thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04),0 0 0 .5px rgba(0,0,0,.04);
  transition:transform .42s var(--spring),width .42s var(--ease)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 calc(var(--gut) * -1);padding:2px var(--gut);scrollbar-width:none;scroll-padding:0 var(--gut)}
.chip{flex-shrink:0;min-height:34px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:500;background:var(--fill);color:var(--ink);transition:background .25s,color .25s,transform .3s var(--out)}
.chip[aria-selected="true"]{background:var(--ink);color:var(--on-ink)}
.chip:active{transform:scale(.95);transition:transform .08s}

/* inputs */
.field{display:block}
.field>.lbl{display:block;font-size:13px;color:var(--ink-2);font-weight:500;margin:0 4px 7px}
.input{width:100%;min-height:50px;border-radius:var(--r-ctl);border:0;box-shadow:inset 0 0 0 1px transparent;background:var(--fill);padding:0 14px;font-size:17px;outline:none;
  transition:box-shadow .2s,background .2s;-webkit-appearance:none;appearance:none;color:var(--ink)}
.input:focus{box-shadow:inset 0 0 0 1.5px var(--acc);background:var(--surface)}
textarea.input{padding:13px 14px;min-height:88px;resize:none;line-height:1.4}
.input::placeholder{color:var(--ink-3)}
input[type="date"].input{display:flex;align-items:center}
.in-unit{position:relative}
.in-unit .input{padding-right:50px}
.in-unit>span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:15px;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.form>*+*{margin-top:18px}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-2)}
.search .input{padding-left:36px;min-height:38px;border-radius:11px;font-size:17px;background:var(--fill)}
.search .input:focus{background:var(--fill);box-shadow:none}

/* stepper */
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--fill);border-radius:20px;padding:8px}
.stepper button{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:400;color:var(--acc);background:var(--surface);box-shadow:var(--sh-card);touch-action:manipulation;transition:transform .25s var(--out)}
.stepper button:active{transform:scale(.9);transition:transform .06s}
.stepper .v{flex:1;text-align:center}
.stepper input{width:100%;text-align:center;border:0;background:transparent;font-family:var(--f-num);font-size:34px;font-weight:700;letter-spacing:-.03em;outline:none;font-variant-numeric:tabular-nums;padding:0;color:var(--ink)}
.stepper .v small{display:block;font-size:13px;color:var(--ink-2);font-weight:500;margin-top:-1px}

/* ---------- progress bars ---------- */
.bar{height:6px;border-radius:99px;background:var(--track);overflow:hidden;display:flex}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .7s var(--ease)}
.bar.thin{height:4px}

/* ---------- energy block ---------- */
.energy .left-lbl{font-size:15px;color:var(--ink-2);font-weight:500}
.energy .hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 16px}
.energy .aside{display:flex;gap:22px;text-align:right}
.energy .aside .t-xs{margin-bottom:3px}
.energy .aside .t-val{font-family:var(--f-num)}
.energy .stack{height:8px}
.energy .stack>i{border-radius:0}
.energy .stack>i:first-child{border-radius:99px 0 0 99px}
.energy .stack>i+i{margin-left:2px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:20px}
.macro .k{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);font-weight:500}
.macro .k i{width:8px;height:8px;border-radius:50%;display:inline-block}
.macro .v{margin:4px 0 8px;font-size:17px;font-weight:650;font-family:var(--f-num)}
.macro .v span{color:var(--ink-3);font-weight:500;font-size:13px}

/* ---------- challenge ---------- */
.pillars{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pillar{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 13px 0 9px;border-radius:999px;background:var(--fill);font-size:14px;font-weight:500;color:var(--ink-2);transition:background .25s,color .25s,transform .3s var(--out)}
.pillar .dot{width:17px;height:17px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink-3);display:grid;place-items:center;transition:all .3s var(--spring)}
.pillar .dot svg{width:10px;height:10px;opacity:0;transform:scale(.4);transition:all .3s var(--spring)}
.pillar.met{color:var(--ink)}
.pillar.met .dot{background:var(--pos);box-shadow:none;color:#fff}
.pillar.met .dot svg{opacity:1;transform:none}
.pillar:active{transform:scale(.95);transition:transform .08s}
.pillar small{color:var(--ink-3);font-weight:500;margin-left:2px;font-size:13px}

/* ---------- targets ---------- */
.tcar{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(var(--gut) * -1);padding:4px var(--gut) 8px;scroll-padding:0 var(--gut);scrollbar-width:none;overscroll-behavior-x:contain}
.tcard{flex:0 0 100%;scroll-snap-align:start;background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh-card);padding:18px 18px 16px;text-align:left;
  display:flex;flex-direction:column;transition:transform .35s var(--out)}
.tcar.multi .tcard{flex-basis:calc(100% - 28px)}
.tcard:active{transform:scale(.98);transition:transform .1s}
.tcard .tt{font-size:13px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:28px}
.tcard .tc{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.tcard .tc .t-hero{font-size:48px}
.tcard .tc .l{font-size:17px;font-weight:550;color:var(--ink);letter-spacing:-.015em}
.tcard .td{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.tcard .bar{margin-top:16px}
.tcard .tfoot{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;color:var(--ink-3);font-weight:500}
.tcard.over .tc .t-hero,.tcard.over .tc .l{color:var(--neg)}
.tcard .corner{position:absolute}
.tdots{display:flex;justify-content:center;gap:6px;margin-top:6px;height:6px}
.tdots i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);opacity:.45;transition:opacity .3s,width .35s var(--ease),background .3s}
.tdots i.on{opacity:1;width:16px;border-radius:3px;background:var(--ink-2)}
.tgt-hero{text-align:center;padding:8px 0 4px}
.tgt-hero .t-hero{font-size:64px}
.tgt-hero .l{font-size:17px;font-weight:550;margin-top:4px}
.ring-ok{width:34px;height:34px;border-radius:50%;background:var(--pos);color:#fff;display:grid;place-items:center;flex-shrink:0}
.ring-ok svg{width:16px;height:16px}
.ring-open{width:34px;height:34px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex-shrink:0}
.ring-open svg{width:18px;height:18px}
.row.done .ttl{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--ink-3);text-decoration-thickness:1px}
.done-badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:color-mix(in srgb,var(--pos) 14%,transparent);color:var(--pos);font-size:13.5px;font-weight:600}
.done-badge svg{width:13px;height:13px}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stats.two{grid-template-columns:repeat(2,1fr)}
.stat{padding:2px 0;min-width:0}
.stat+.stat{padding-left:16px;box-shadow:inset var(--hair) 0 0 var(--line)}
.stat .t-xs{margin-bottom:4px}
.stat .t-metric{white-space:nowrap}
.stat .d{font-size:12.5px;margin-top:2px;font-weight:500}

/* ---------- charts ---------- */
.chart{position:relative;margin-top:18px;touch-action:pan-y}
.chart svg{width:100%;height:auto;overflow:visible}
.chart .axis{font-size:10.5px;fill:var(--ink-3);font-family:var(--f-num);font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--line);stroke-width:.5}
.chart .tip{position:absolute;top:-10px;transform:translate(-50%,4px);background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;padding:6px 10px;border-radius:10px;white-space:nowrap;pointer-events:none;
  opacity:0;transition:opacity .15s,transform .25s var(--out);box-shadow:var(--sh-float);font-family:var(--f-num)}
.chart .tip small{font-weight:500;color:var(--ink-2);margin-left:5px;font-family:var(--f)}
.chart.hot .tip{opacity:1;transform:translate(-50%,0)}
.empty-chart{height:150px;display:grid;place-items:center;text-align:center;color:var(--ink-2);font-size:14px;background:var(--surface-2);border-radius:14px;margin-top:18px;padding:18px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:-6px 0 22px}
.week button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 8px;border-radius:14px;transition:transform .3s var(--out)}
.week button:active{transform:scale(.92);transition:transform .08s}
.week .dw{font-size:12px;color:var(--ink-3);font-weight:600}
.week .dn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:500;font-family:var(--f-num);font-variant-numeric:tabular-nums;transition:background .3s,color .3s}
.week .on .dn{background:var(--ink);color:var(--on-ink);font-weight:650}
.week .today:not(.on) .dn{color:var(--acc);font-weight:650}
.week .dots{display:flex;gap:3px;height:4px}
.week .dots i{width:4px;height:4px;border-radius:50%;background:var(--ink-3)}
.week .fut{opacity:.35;pointer-events:none}

/* ---------- empty ---------- */
.empty{text-align:center;padding:30px 22px}
.empty .ttl{font-size:17px;font-weight:600;letter-spacing:-.02em}
.empty .t-sm{margin:6px auto 18px;max-width:270px}
.inline-empty{padding:18px;color:var(--ink-2);font-size:15px}

/* ---------- floating tab bar ---------- */
.edge{position:fixed;left:0;right:0;bottom:0;height:calc(var(--bar-h) + var(--bar-gap) + 36px);z-index:19;pointer-events:none;
  background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 0%,transparent),color-mix(in srgb,var(--bg) 82%,transparent) 55%,var(--bg))}
.tabbar{position:fixed;left:0;right:0;bottom:var(--bar-gap);z-index:20;pointer-events:none;transition:transform .45s var(--ease),opacity .3s}
.tabbar.away{transform:translateY(calc(100% + var(--bar-gap) + 20px));opacity:0}
.tabbar .in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:10px;padding:0 16px}
.tb-pill{position:relative;flex:1;height:var(--bar-h);border-radius:999px;display:grid;grid-template-columns:repeat(4,1fr);padding:4px;pointer-events:auto;
  background:var(--mat);-webkit-backdrop-filter:saturate(190%) blur(24px);backdrop-filter:saturate(190%) blur(24px);box-shadow:var(--sh-float),inset 0 0 0 var(--hair) var(--mat-line)}
.tb-ind{position:absolute;top:4px;bottom:4px;left:4px;border-radius:999px;background:var(--fill);transition:transform .5s var(--spring),width .4s var(--ease)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:100%;color:var(--ink-2);font-size:10.5px;font-weight:600;letter-spacing:.005em;transition:color .25s}
.tab svg{width:25px;height:25px;transition:transform .35s var(--spring)}
.tab[aria-selected="true"]{color:var(--acc)}
.tab:active svg{transform:scale(.86);transition:transform .08s}
.add-btn{width:var(--bar-h);height:var(--bar-h);flex:0 0 var(--bar-h);border-radius:50%;pointer-events:auto;display:grid;place-items:center;background:var(--acc);color:#fff;
  box-shadow:0 8px 24px color-mix(in srgb,var(--acc) 38%,transparent),0 2px 6px rgba(0,0,0,.12);transition:transform .4s var(--spring)}
.add-btn svg{width:26px;height:26px;transition:transform .45s var(--spring)}
.add-btn:active{transform:scale(.9);transition:transform .08s}
.add-btn.open svg{transform:rotate(45deg)}

/* ---------- sheets ---------- */
.layer{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .4s ease}
.layer.open .scrim{opacity:1}
.sheet{position:relative;width:100%;max-width:var(--maxw);max-height:calc(100dvh - var(--sat) - 10px);background:var(--surface);border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  box-shadow:var(--sh-sheet);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .5s var(--ease);will-change:transform}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sheet{background:#1C1C1E}}
.layer.open .sheet{transform:translateY(0)}
.sheet.full{height:calc(100dvh - var(--sat) - 10px)}
.sheet .grab{padding:6px 0 0;display:grid;place-items:center;touch-action:none;cursor:grab}
.sheet .grab i{width:36px;height:5px;border-radius:9px;background:var(--fill-2)}
.sheet .hd{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;padding:6px 14px 10px;touch-action:none;gap:8px}
.sheet .hd .t-h{grid-column:2;text-align:center;font-size:17px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .hd .icon-btn{grid-column:3;width:32px;height:32px;background:var(--fill)}
.sheet .hd .icon-btn svg{width:13px;height:13px;color:var(--ink-2)}
.sheet .bd{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px var(--gut) calc(24px + var(--sab));overscroll-behavior:contain;flex:1}
.sheet .bd .rows{margin:0 calc(var(--gut) * -1)}
.sheet .bd .rows .row{padding-left:var(--gut);padding-right:var(--gut)}
.sheet .bd .rows>*+*::before{left:var(--gut)}
.sheet .bd .rows>*+*:has(.ico)::before,.sheet .bd .rows>*+*:has(.ring-ok)::before,.sheet .bd .rows>*+*:has(.ring-open)::before{left:calc(var(--gut) + 48px)}
.sheet .foot{padding:12px var(--gut) calc(12px + var(--sab));background:var(--surface)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sheet .foot{background:#1C1C1E}}
.sheet.has-foot .bd{padding-bottom:16px}
.sheet .grouped{background:var(--surface-2);border-radius:16px;overflow:hidden}
.sheet .bd .grouped.rows{margin:0}
.sheet .bd .grouped .row{background:var(--surface-2);padding-left:16px;padding-right:16px}
.sheet .bd .grouped>*+*::before{left:16px!important}
.sheet .bd .grouped>*+*:has(.ring-ok,.ring-open,.ico)::before{left:64px!important}
.sheet .bd .grouped button.row:active{background:var(--fill)}
.sheet .sec-t{font-size:13px;color:var(--ink-2);font-weight:500;margin:26px 4px 8px;letter-spacing:0}
.sheet .sec-t:first-child{margin-top:4px}
.sheet .grp-h{font-size:20px;font-weight:680;letter-spacing:-.022em;margin:34px 4px 14px}
.goal-line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;color:var(--ink-2)}
.goal-line .num{color:var(--ink);font-weight:600;font-family:var(--f-num)}
.sheet .note{font-size:13px;color:var(--ink-2);margin:8px 4px 0;line-height:1.4}

/* quick log grid */
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.action{display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding:16px;border-radius:18px;background:var(--surface-2);min-height:104px;transition:transform .3s var(--out),background .2s}
.action:active{transform:scale(.96);transition:transform .08s}
.action .aic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--acc)}
.action svg{width:19px;height:19px}
.action .ttl{font-size:16px;font-weight:600;letter-spacing:-.015em}
.action .t-xs{margin-top:1px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--bar-h) + var(--bar-gap) + 14px);z-index:90;transform:translate(-50%,10px) scale(.96);opacity:0;pointer-events:none;
  background:var(--mat);-webkit-backdrop-filter:saturate(190%) blur(24px);backdrop-filter:saturate(190%) blur(24px);color:var(--ink);
  border-radius:999px;padding:0 6px 0 18px;min-height:46px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:550;
  transition:opacity .25s,transform .45s var(--spring);max-width:calc(100% - 40px);box-shadow:var(--sh-float),inset 0 0 0 var(--hair) var(--mat-line);white-space:nowrap}
.toast span{overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.toast button{color:var(--acc);font-weight:600;padding:10px 12px;border-radius:999px}
.toast:not(.act){padding-right:18px}

/* ---------- workout session ---------- */
.session{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;animation:up .5s var(--ease) both}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.session .s-top{padding:calc(var(--sat) + 8px) var(--gut) 12px;max-width:var(--maxw);width:100%;margin:0 auto;display:flex;align-items:center;gap:8px}
.session .s-top .icon-btn{background:var(--surface);box-shadow:var(--sh-card);width:38px;height:38px}
.session .s-top .mid{flex:1;min-width:0;text-align:center}
.session .s-top .mid .t-val{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}
.session .s-body{flex:1;overflow-y:auto;padding:4px var(--gut) calc(150px + var(--sab));max-width:var(--maxw);width:100%;margin:0 auto}
.ex{margin-top:14px}
.ex .ex-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.ex .ex-h .t-val{font-size:17px;font-weight:650}
.sets{padding:0 8px 10px}
.set{display:grid;grid-template-columns:30px 1fr 74px 64px 44px;gap:6px;align-items:center;padding:4px 8px;border-radius:12px;transition:background .3s}
.set.hd{font-size:12px;color:var(--ink-3);font-weight:600;padding-top:0;padding-bottom:2px}
.set.hd>*{text-align:center}.set.hd>*:nth-child(2){text-align:left}
.set .n{text-align:center;font-weight:650;font-size:15px;color:var(--ink-2);font-family:var(--f-num)}
.set .prev{font-size:13.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set input{width:100%;height:42px;border-radius:10px;border:0;background:var(--fill);text-align:center;font-family:var(--f-num);font-size:17px;font-weight:650;outline:none;font-variant-numeric:tabular-nums;padding:0;color:var(--ink);transition:box-shadow .2s,background .2s}
.set input:focus{box-shadow:inset 0 0 0 1.5px var(--acc);background:var(--surface)}
.set .ck{width:42px;height:42px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--ink-3);transition:background .3s,color .3s,transform .35s var(--spring)}
.set .ck svg{width:18px;height:18px}
.set .ck:active{transform:scale(.85);transition:transform .06s}
.set.done{background:color-mix(in srgb,var(--pos) 11%,transparent)}
.set.done .ck{background:var(--pos);color:#fff}
.set.done input{background:transparent}
.rest{position:fixed;left:16px;right:16px;bottom:var(--bar-gap);z-index:41;max-width:calc(var(--maxw) - 32px);margin:0 auto;border-radius:24px;
  background:var(--mat);-webkit-backdrop-filter:saturate(190%) blur(24px);backdrop-filter:saturate(190%) blur(24px);box-shadow:var(--sh-float),inset 0 0 0 var(--hair) var(--mat-line);
  padding:12px 12px 12px 18px;transform:translateY(calc(100% + 60px));transition:transform .5s var(--ease)}
.rest.on{transform:none}
.rest .in{display:flex;align-items:center;gap:10px}
.rest .clock{font-family:var(--f-num);font-size:28px;font-weight:700;letter-spacing:-.03em;min-width:74px}
.rest .bar{flex:1}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .dw{font-size:12px;color:var(--ink-3);font-weight:600;padding:6px 0}
.cal button{height:46px;border-radius:50%;width:46px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:17px;font-weight:450;font-family:var(--f-num);font-variant-numeric:tabular-nums;transition:transform .3s var(--out),background .2s}
.cal button:active{transform:scale(.88);transition:transform .06s}
.cal button i{width:4px;height:4px;border-radius:50%;background:var(--ink-3);opacity:0}
.cal button.has i{opacity:1}
.cal button.sel{background:var(--ink);color:var(--on-ink);font-weight:650}
.cal button.sel i{background:var(--on-ink)}
.cal button.tod:not(.sel){color:var(--acc);font-weight:650}
.cal button[disabled]{opacity:.28}

.pill-tag{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;background:var(--fill);font-size:13.5px;font-weight:600;color:var(--ink-2)}
.pill-tag.acc{background:var(--acc-soft);color:var(--acc)}
.hr{height:var(--hair);background:var(--line);margin:18px 0}
.center{text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (min-width:600px){ #app{padding-top:32px} .sheet{border-radius:var(--r-sheet);margin-bottom:24px;max-height:calc(100dvh - 48px)} .sheet.full{height:calc(100dvh - 48px)} }
</style>

<body>
<header class="nav" id="nav" aria-hidden="true"><div class="in" id="navT"></div></header>
<main id="app"><div id="view"></div></main>
<div class="edge" aria-hidden="true"></div>
<nav class="tabbar" id="tabbar" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* =====================================================================
   Health OS 3
   Data model and storage keys are compatible with Health OS 2, so any
   data already on this device loads unchanged. Unknown fields are kept.
   ===================================================================== */

/* ---------- utilities ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0;};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round=(v,d=0)=>{const m=Math.pow(10,d);return Math.round(v*m)/m;};
const DASH='–';
const fmt=(v,d=0)=>(v==null||!isFinite(v))?DASH:round(v,d).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const sum=(a,f)=>a.reduce((t,x)=>t+(f?f(x):x),0);
const signed=(v,d=1)=>v==null||!isFinite(v)?DASH:(round(v,d)>0?'+':round(v,d)<0?'−':'')+fmt(Math.abs(v),d);
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const key=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const todayKey=()=>key(new Date());
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return key(d);};
const daysBetween=(a,b)=>Math.round((parseKey(b)-parseKey(a))/864e5);
const isWeekend=k=>{const d=parseKey(k).getDay();return d===0||d===6;};
const monday=k=>{const d=parseKey(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return key(d);};
const shortDate=k=>{const d=parseKey(k);return MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate();};
const longDate=k=>{const d=parseKey(k);return DAYS[d.getDay()]+', '+MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate();};
const relDay=k=>k===todayKey()?'Today':k===addDays(todayKey(),-1)?'Yesterday':longDate(k);
const nowTime=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const mmss=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?h+':'+String(m).padStart(2,'0'):String(m))+':'+String(x).padStart(2,'0');};
const durWords=s=>{s=Math.round(s/60);const h=Math.floor(s/60),m=s%60;return h?h+' h '+(m?m+' min':''):m+' min';};
const parseDur=t=>{const p=String(t).trim().split(':').map(n=>num(n));if(p.length===3)return p[0]*3600+p[1]*60+p[2];
  if(p.length===2)return p[0]*60+p[1];return p[0]*60;};
const haptic=p=>{try{navigator.vibrate&&navigator.vibrate(p||8);}catch(e){}};
const plural=(n,w)=>n+' '+w+(n===1?'':'s');

/* units: storage is always kg, km, ml */
const U={
  w:v=>S.settings.units.weight==='lb'?v*2.20462:v, wIn:v=>S.settings.units.weight==='lb'?v/2.20462:v, wL:()=>S.settings.units.weight,
  d:v=>S.settings.units.dist==='mi'?v*0.621371:v, dIn:v=>S.settings.units.dist==='mi'?v/0.621371:v, dL:()=>S.settings.units.dist
};
const paceFmt=spk=>spk>0?mmss(S.settings.units.dist==='mi'?spk*1.609344:spk):DASH;
const paceOf=r=>(r.dist>0&&r.dur>0)?r.dur/r.dist:0;
const e1rm=(w,r)=>(w>0&&r>0)?w*(1+Math.min(r,15)/30):0;

/* ---------- storage: IndexedDB primary, localStorage mirror ---------- */
const DB_NAME='healthos',STORE='state',LS_KEY='healthos.state.v1';
let _db=null;
function idb(){return new Promise(res=>{
  if(_db)return res(_db);if(!window.indexedDB)return res(null);
  try{const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE);};
    r.onsuccess=()=>{_db=r.result;res(_db);};r.onerror=()=>res(null);}catch(e){res(null);}});}
async function loadState(){
  let data=null;const db=await idb();
  if(db){data=await new Promise(res=>{try{const t=db.transaction(STORE,'readonly').objectStore(STORE).get('blob');
    t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null);}catch(e){res(null);}});}
  try{const raw=localStorage.getItem(LS_KEY);if(raw){const ls=JSON.parse(raw);if(!data||(ls.savedAt||0)>(data.savedAt||0))data=ls;}}catch(e){}
  return data;}
let saveTimer=null;
function persist(){clearTimeout(saveTimer);S.savedAt=Date.now();const str=JSON.stringify(S);
  try{localStorage.setItem(LS_KEY,str);}catch(e){toast('Storage is full. Export a backup in Settings.');}
  idb().then(db=>{if(db){try{db.transaction(STORE,'readwrite').objectStore(STORE).put(JSON.parse(str),'blob');}catch(e){}}});}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(persist,200);}

/* ---------- model ---------- */
const DEFAULTS=()=>({
  v:3,seeded:true,demo:false,
  settings:{theme:'system',units:{weight:'kg',dist:'km',vol:'ml'},
    targets:{kcal:2400,protein:170,carbs:250,fat:70,fibre:30,water:3000},
    goals:{weight:null,weightBy:null,raceName:'',raceDate:null,raceDist:null,raceTime:null}},
  foods:[],meals:[],workouts:[],habits:[],targets:[],log:{},challenge:null,
  recent:{foods:[],water:[250,500,750],workout:null,exercises:[]}
});
function hydrate(data){const base=DEFAULTS(),o=Object.assign(base,data);
  const ds=data.settings||{};
  o.settings=Object.assign(DEFAULTS().settings,ds);
  ['units','targets','goals'].forEach(k=>{o.settings[k]=Object.assign(DEFAULTS().settings[k],ds[k]||{});});
  o.recent=Object.assign(DEFAULTS().recent,data.recent||{});
  ['foods','meals','workouts','habits','targets'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[];});
  if(!o.log||typeof o.log!=='object')o.log={};return o;}
let S=DEFAULTS();
const UI={tab:'today',date:todayKey(),trainSeg:'lift',range:'90D'};

function day(k,make){
  if(!S.log[k]){if(!make)return null;S.log[k]={food:[],water:[],workouts:[],runs:[],body:null,habits:{},note:''};}
  const d=S.log[k];d.food=d.food||[];d.water=d.water||[];d.workouts=d.workouts||[];d.runs=d.runs||[];d.habits=d.habits||{};return d;}
const EMPTY_DAY={food:[],water:[],workouts:[],runs:[],body:null,habits:{}};
const dayOr=k=>day(k)||EMPTY_DAY;
const dayHas=k=>{const d=S.log[k];if(!d)return false;
  return !!((d.food||[]).length||(d.water||[]).length||(d.workouts||[]).length||(d.runs||[]).length||(d.body&&d.body.weight!=null));};
function macros(k){const t={kcal:0,p:0,c:0,f:0,fib:0};dayOr(k).food.forEach(e=>{t.kcal+=e.kcal||0;t.p+=e.p||0;t.c+=e.c||0;t.f+=e.f||0;t.fib+=e.fib||0;});return t;}
const waterOf=k=>sum(dayOr(k).water,w=>w.ml||0);
function foodMacros(food,qty){const r=(qty||0)/(food.serving||100);
  return {kcal:(food.kcal||0)*r,p:(food.p||0)*r,c:(food.c||0)*r,f:(food.f||0)*r,fib:(food.fib||0)*r,sugar:(food.sugar||0)*r,sodium:(food.sodium||0)*r};}
const foodById=id=>S.foods.find(f=>f.id===id);
const weightOn=k=>{const d=S.log[k];return d&&d.body&&d.body.weight!=null?d.body.weight:null;};
function lastWeigh(k){let c=k||todayKey();for(let i=0;i<730;i++){const w=weightOn(c);if(w!=null)return {k:c,w};c=addDays(c,-1);}return null;}
function weighIns(){return Object.keys(S.log).filter(k=>weightOn(k)!=null).sort().map(k=>({k,w:weightOn(k)}));}
/* 7-day trailing mean of weigh-ins, the number worth watching */
function trend(k){const v=[];for(let i=0;i<7;i++){const w=weightOn(addDays(k,-i));if(w!=null)v.push(w);}return v.length?sum(v)/v.length:null;}
/* weekly rate: least squares slope over the last 28 days */
function weeklyRate(){const t=todayKey(),pts=[];
  for(let i=0;i<28;i++){const w=weightOn(addDays(t,-i));if(w!=null)pts.push([-i,w]);}
  if(pts.length<4)return null;const n=pts.length,mx=sum(pts,p=>p[0])/n,my=sum(pts,p=>p[1])/n,sxx=sum(pts,p=>(p[0]-mx)**2);
  if(!sxx)return null;return sum(pts,p=>(p[0]-mx)*(p[1]-my))/sxx*7;}
function allLogged(kind){const out=[];Object.keys(S.log).forEach(k=>{(S.log[k][kind]||[]).forEach(x=>out.push(Object.assign({_k:k},x)));});
  return out.sort((a,b)=>a._k<b._k?1:a._k>b._k?-1:0);}
const volumeOf=w=>sum(w.exercises||[],e=>sum(e.sets||[],s=>(s.w||0)*(s.r||0)));
const setsOf=w=>sum(w.exercises||[],e=>(e.sets||[]).length);

/* habits & challenge (kept from v2) */
const habitTarget=(hb,k)=>(isWeekend(k)&&hb.targetWe)?hb.targetWe:hb.target;
function habitMet(hb,k,min){const d=S.log[k];const v=d&&d.habits?d.habits[hb.id]:null;
  if(v==null)return false;if(hb.type==='check')return !!v;const t=min!=null?min:habitTarget(hb,k);return t?v>=t:v>0;}
function pillarMet(p,k){const d=S.log[k];if(!d)return false;
  if(p.src==='workout')return (d.workouts||[]).length>0;
  if(p.src==='run')return (d.runs||[]).length>0;
  if(p.src==='food')return (d.food||[]).length>0;
  if(p.src==='water')return waterOf(k)>=S.settings.targets.water;
  if(p.src==='weight')return !!(d.body&&d.body.weight!=null);
  const hb=S.habits.find(h=>h.id===p.habitId);return hb?habitMet(hb,k,p.min):false;}
const chalDay=k=>S.challenge?daysBetween(S.challenge.start,k)+1:0;
const pillarsMet=k=>S.challenge?S.challenge.pillars.filter(p=>pillarMet(p,k)).length:0;
const perfect=k=>{const c=S.challenge;if(!c||!c.pillars.length)return false;const n=chalDay(k);return n>=1&&n<=c.days&&pillarsMet(k)===c.pillars.length;};
function streak(test){let c=todayKey(),n=0;if(!test(c))c=addDays(c,-1);while(test(c)&&n<3000){n++;c=addDays(c,-1);}return n;}

/* targets: a title and a date, counted down from the day they were set */
const fullDate=k=>{const d=parseKey(k);return DAYS[d.getDay()]+', '+MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();};
const daysLeft=t=>daysBetween(todayKey(),t.date);
const dueText=n=>n>1?n+' days remaining':n===1?'1 day remaining':n===0?'Due today':(-n)+(n===-1?' day':' days')+' overdue';
function targetProgress(t){const s=t.created||todayKey(),tot=daysBetween(s,t.date);return tot<=0?1:clamp(daysBetween(s,todayKey())/tot,0,1);}
function elapsedText(t){const s=t.created||todayKey(),n=daysBetween(s,todayKey());return n<=0?'Set today':'Set '+plural(n,'day')+' ago';}
const activeTargets=()=>S.targets.filter(t=>!t.done).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
const doneTargets=()=>S.targets.filter(t=>t.done).sort((a,b)=>(b.doneAt||'')<(a.doneAt||'')?-1:1);
const MEALS=['Breakfast','Lunch','Dinner','Snacks'];
const MEALS_ALL=['Breakfast','Lunch','Dinner','Snacks','Drinks','Supplements'];
const RUN_TYPES=['Easy','Long','Tempo','Intervals','Recovery','Race'];
const guessMeal=()=>{const h=new Date().getHours();return h<11?'Breakfast':h<16?'Lunch':h<21?'Dinner':'Snacks';};

/* ---------- icons: one stroke family ---------- */
const svg=(d,w)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||1.75}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I={
  today:svg('<rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 2.75v3.5M16 2.75v3.5"/>'),
  food:svg('<path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10"/><path d="M17 21V3c-2.2 1.2-3.5 3.6-3.5 7v3.5H17"/>'),
  train:svg('<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>'),
  progress:svg('<path d="M4 19.5h16"/><path d="M4 15l4.5-4.5 3.5 3 7-7"/><path d="M15 6.5h4v4"/>'),
  plus:svg('<path d="M12 5v14M5 12h14"/>',2),
  close:svg('<path d="M6 6l12 12M18 6L6 18"/>',2.2),
  chev:svg('<path d="M9 5.5l6.5 6.5L9 18.5"/>',2),

/* ---------- toast ---------- */
let toastT=null;
function toast(msg,act){const t=$('#toast');clearTimeout(toastT);
  t.innerHTML=`<span>${esc(msg)}</span>`+(act?`<button type="button">${esc(act.label)}</button>`:'');
  t.classList.toggle('act',!!act);t.classList.add('on');
  if(act)$('button',t).onclick=()=>{t.classList.remove('on');act.fn();};
  toastT=setTimeout(()=>t.classList.remove('on'),act?4500:2200);}
function undoable(msg,mutate){const snap=JSON.stringify(S);mutate();save();render();
  toast(msg,{label:'Undo',fn:()=>{S=hydrate(JSON.parse(snap));persist();render();}});}

/* ---------- sheets ---------- */
const sheets=[];
function openSheet(o){
  const layer=document.createElement('div');layer.className='layer';
  layer.innerHTML=`<div class="scrim"></div><div class="sheet ${o.full?'full':''} ${o.foot?'has-foot':''}" role="dialog" aria-modal="true" aria-label="${esc(o.title||'')}">
    <div class="grab"><i></i></div>
    <div class="hd"><div class="t-h">${esc(o.title||'')}</div>${o.headAct||''}<button class="icon-btn" data-close aria-label="Close">${I.close}</button></div>
    <div class="bd">${o.body||''}</div>${o.foot?`<div class="foot">${o.foot}</div>`:''}</div>`;
  document.body.appendChild(layer);
  const sheet=$('.sheet',layer);
  const close=(after)=>{if(layer._closing)return;layer._closing=true;layer.classList.remove('open');
    const i=sheets.indexOf(layer);if(i>-1)sheets.splice(i,1);
    setTimeout(()=>{layer.remove();if(o.onClose)o.onClose();if(typeof after==='function')after();},300);};
  layer._close=close;sheets.push(layer);
  $('.scrim',layer).addEventListener('click',()=>close());
  $('[data-close]',layer).addEventListener('click',()=>close());
  /* drag down to dismiss, from the grab handle or header */
  let y0=null,dy=0,t0=0;
  const start=e=>{if(e.target.closest('button,input'))return;y0=e.clientY;dy=0;t0=Date.now();sheet.style.transition='none';
    e.currentTarget.setPointerCapture&&e.currentTarget.setPointerCapture(e.pointerId);};
  const move=e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);sheet.style.transform=`translateY(${dy}px)`;};
  const end=()=>{if(y0==null)return;y0=null;sheet.style.transition='';const v=dy/Math.max(1,Date.now()-t0);
    if(dy>110||v>.6){sheet.style.transform='';close();}else sheet.style.transform='';};
  [$('.grab',layer),$('.hd',layer)].forEach(h=>{h.addEventListener('pointerdown',start);h.addEventListener('pointermove',move);
    h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);});
  requestAnimationFrame(()=>requestAnimationFrame(()=>layer.classList.add('open')));
  if(o.onMount)o.onMount(layer,close);
  if(o.focus){const f=$(o.focus,layer);if(f)setTimeout(()=>f.focus(),320);}
  return {el:layer,close};}
const closeTop=()=>{const l=sheets[sheets.length-1];if(l)l._close();};
/* close one sheet, then run the next step once it has left */
const then=(close,fn)=>close(fn);
function confirmSheet(title,msg,label,fn){openSheet({title,body:`<p class="t-sm" style="margin:0 0 20px;font-size:15px">${esc(msg)}</p>
  <button class="btn wide" style="background:var(--neg);color:#fff" data-ok>${esc(label)}</button>
  <button class="btn wide quiet" style="margin-top:6px;color:var(--ink-2)" data-no>Cancel</button>`,
  onMount:(el,close)=>{$('[data-ok]',el).onclick=()=>close(fn);$('[data-no]',el).onclick=()=>close();}});}

/* ---------- segmented control ---------- */
function seg(id,opts,val){return `<div class="seg" data-seg="${id}" role="tablist"><span class="thumb"></span>${opts.map(([v,l])=>
  `<button type="button" role="tab" data-v="${v}" aria-selected="${v===val}">${esc(l)}</button>`).join('')}</div>`;}
function placeThumbs(root){$$('.seg',root).forEach(s=>{const b=$('[aria-selected="true"]',s),t=$('.thumb',s);if(!b||!t)return;
  t.style.width=b.offsetWidth+'px';t.style.transform=`translateX(${b.offsetLeft-2}px)`;t.style.left='2px';});}
function bindSeg(root,id,fn){const s=$(`[data-seg="${id}"]`,root);if(!s)return;
  s.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b||b.getAttribute('aria-selected')==='true')return;
    $$('button',s).forEach(x=>x.setAttribute('aria-selected',x===b));placeThumbs(s.parentNode);haptic(5);fn(b.dataset.v);});}
function bindChips(root,sel,fn){const c=$(sel,root);if(!c)return;c.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;

/* ---------- swipe-to-delete rows ---------- */
function bindSwipe(root,onDelete){
  $$('.srow',root).forEach(sr=>{const row=$('.row',sr);let x0=0,y0=0,dx=0,lock=null,open=false;
    row.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;x0=e.clientX;y0=e.clientY;dx=0;lock=null;sr.classList.remove('anim');});
    row.addEventListener('pointermove',e=>{if(x0==null)return;const mx=e.clientX-x0,my=e.clientY-y0;
      if(lock==null&&(Math.abs(mx)>8||Math.abs(my)>8))lock=Math.abs(mx)>Math.abs(my)?'x':'y';
      if(lock!=='x')return;sr.classList.add('sw');dx=clamp((open?-88:0)+mx,-140,0);row.style.transform=`translateX(${dx}px)`;});
    const end=()=>{if(lock==='x'){sr.classList.add('anim');open=dx<-50;row.style.transform=open?'translateX(-88px)':'';if(!open)setTimeout(()=>{if(!open)sr.classList.remove('sw');},400);
        row._swiped=Date.now();if(open){$$('.srow',root).forEach(o=>{if(o!==sr){o.classList.add('anim');$('.row',o).style.transform='';o._reset&&o._reset();setTimeout(()=>o.classList.remove('sw'),400);}});}}
      x0=null;lock=null;};
    sr._reset=()=>{open=false;};
    row.addEventListener('pointerup',end);row.addEventListener('pointercancel',end);
    row.addEventListener('click',e=>{if(row._swiped&&Date.now()-row._swiped<350){e.stopPropagation();e.preventDefault();return;}
      if(open){e.stopPropagation();e.preventDefault();sr.classList.add('anim');row.style.transform='';open=false;setTimeout(()=>sr.classList.remove('sw'),400);}},true);
    $('.del',sr).addEventListener('click',()=>{haptic(12);onDelete(sr.dataset.id,sr.dataset);});});}
const srow=(id,inner,extra)=>`<div class="srow" data-id="${id}" ${extra||''}><button class="del" type="button">Delete</button>${inner}</div>`;

/* ---------- press-and-hold repeat for steppers ---------- */
function bindHold(root,sel,fn){$$(sel,root).forEach(b=>{let t=null,iv=null;
  const stop=()=>{clearTimeout(t);clearInterval(iv);t=iv=null;};
  b.addEventListener('pointerdown',e=>{e.preventDefault();fn(b);haptic(4);t=setTimeout(()=>{iv=setInterval(()=>fn(b),70);},380);});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
  b.addEventListener('click',e=>e.preventDefault());});}

/* ---------- charts ---------- */
/* line chart: series of {x (day index), y}, optional smooth trend + goal line, scrubbable */
function lineChart(o){
  const W=340,H=o.h||150,pl=0,pr=34,pt=10,pb=22;
  const pts=o.points;if(!pts.length)return '';
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y).concat(o.trend?o.trend.map(p=>p.y):[]).concat(o.goal!=null?[o.goal]:[]);
  let x0=o.xMin!=null?o.xMin:Math.min(...xs),x1=o.xMax!=null?o.xMax:Math.max(...xs);if(x1===x0)x1=x0+1;
  let y0=Math.min(...ys),y1=Math.max(...ys);const padY=Math.max((y1-y0)*.15,o.minPad||.5);y0-=padY;y1+=padY;
  const X=x=>pl+(x-x0)/(x1-x0)*(W-pl-pr),Y=y=>pt+(1-(y-y0)/(y1-y0))*(H-pt-pb);
  const ticks=3,grid=[];for(let i=0;i<=ticks;i++){const v=y0+(y1-y0)*i/ticks;grid.push(`<line class="grid" x1="0" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${W-pr+6}" y="${Y(v)+3.5}">${fmt(v,o.dec==null?1:o.dec)}</text>`);}
  const path=a=>a.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join('');
  const raw=o.trend?pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="2.2" fill="var(--ink-3)" opacity=".55"/>`).join(''):'';
  const main=o.trend||pts;
  const area=path(main)+`L${X(main[main.length-1].x)} ${H-pb}L${X(main[0].x)} ${H-pb}Z`;
  const goal=o.goal!=null?`<line x1="0" x2="${W-pr}" y1="${Y(o.goal)}" y2="${Y(o.goal)}" stroke="var(--pos)" stroke-dasharray="3 4" stroke-width="1.2"/>`:'';
  const labels=(o.xLabels||[]).map(l=>`<text class="axis" x="${X(l.x)}" y="${H-5}" text-anchor="${l.anchor||'middle'}">${esc(l.t)}</text>`).join('');
  const last=main[main.length-1];
  const data=JSON.stringify(main.map(p=>[+X(p.x).toFixed(1),+Y(p.y).toFixed(1),p.tip||'']));
  return `<div class="chart" data-line='${esc(data)}' data-w="${W}"><div class="tip"></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Chart')}">
    <defs><linearGradient id="lg${o.id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${o.color}" stop-opacity=".14"/><stop offset="1" stop-color="${o.color}" stop-opacity="0"/></linearGradient></defs>
    ${grid.join('')}${goal}<path d="${area}" fill="url(#lg${o.id})"/>${raw}
    <path d="${path(main)}" fill="none" stroke="${o.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(last.x)}" cy="${Y(last.y)}" r="3.5" fill="${o.color}" stroke="var(--surface)" stroke-width="2"/>
    <line class="cursor" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="var(--ink-3)" stroke-width="1" opacity="0"/>
    <circle class="cdot" r="4" fill="${o.color}" stroke="var(--surface)" stroke-width="2" opacity="0"/>${labels}</svg></div>`;}
/* bar chart: vals [{v, label, tip, hi}], optional target line */
function barChart(o){
  const W=340,H=o.h||120,pr=34,pt=8,pb=20,n=o.vals.length;let gap=o.gap||(n>20?3:6);
  const max=Math.max(o.target||0,...o.vals.map(v=>v.v),1)*1.1;
  let bw=(W-pr-gap*(n-1))/n;if(bw>20&&n>1){bw=20;gap=(W-pr-bw*n)/(n-1);}else if(bw>20){bw=20;}const Y=v=>pt+(1-v/max)*(H-pt-pb);
  const bars=o.vals.map((v,i)=>{const x=i*(bw+gap),h=Math.max(v.v>0?2:0,(H-pt-pb)-(Y(v.v)-pt));
    return `<rect x="${x.toFixed(1)}" y="${(H-pb-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(4,bw/2)}" fill="${v.col||o.color}" opacity="${v.hi?1:.28}"/>
      ${v.label!=null?`<text class="axis" x="${(x+bw/2).toFixed(1)}" y="${H-5}" text-anchor="middle">${esc(v.label)}</text>`:''}`;}).join('');
  const tgt=o.target?`<line x1="0" x2="${W-pr}" y1="${Y(o.target)}" y2="${Y(o.target)}" stroke="var(--ink-2)" stroke-dasharray="3 4" stroke-width="1"/><text class="axis" x="${W-pr+6}" y="${Y(o.target)+3.5}">${fmt(o.target,o.dec||0)}</text>`:
    `<text class="axis" x="${W-pr+6}" y="${pt+4}">${fmt(max/1.1,o.dec||0)}</text>`;
  const data=JSON.stringify(o.vals.map((v,i)=>[+(i*(bw+gap)+bw/2).toFixed(1),+Y(v.v).toFixed(1),v.tip||'']));
  return `<div class="chart" data-bar='${esc(data)}' data-w="${W}"><div class="tip"></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Chart')}">
    <line class="grid" x1="0" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}"/>${bars}${tgt}</svg></div>`;}
/* touch scrubbing for both chart types */
function bindCharts(root){$$('.chart',root).forEach(ch=>{const raw=ch.dataset.line||ch.dataset.bar;if(!raw)return;
  const pts=JSON.parse(raw),W=+ch.dataset.w,svgEl=$('svg',ch),tip=$('.tip',ch),cur=$('.cursor',ch),dot=$('.cdot',ch);
  const show=e=>{const r=svgEl.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*W;
    let best=pts[0];pts.forEach(p=>{if(Math.abs(p[0]-sx)<Math.abs(best[0]-sx))best=p;});
    ch.classList.add('hot');tip.innerHTML=best[2];tip.style.left=clamp(best[0]/W*r.width,40,r.width-40)+'px';
    if(cur){cur.setAttribute('x1',best[0]);cur.setAttribute('x2',best[0]);cur.setAttribute('opacity',1);}
    if(dot){dot.setAttribute('cx',best[0]);dot.setAttribute('cy',best[1]);dot.setAttribute('opacity',1);}};
  const hide=()=>{ch.classList.remove('hot');if(cur)cur.setAttribute('opacity',0);if(dot)dot.setAttribute('opacity',0);};
  ch.addEventListener('pointerdown',show);ch.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)show(e);});
  ch.addEventListener('pointerleave',hide);ch.addEventListener('pointerup',()=>setTimeout(hide,1400));ch.addEventListener('pointercancel',hide);});}

/* energy summary, the one bold element on Today */
function energyBlock(k,compact){const m=macros(k),t=S.settings.targets,left=t.kcal-m.kcal,over=left<0;
  const pk=m.p*4,ck=m.c*4,fk=m.f*9,tot=Math.max(t.kcal,m.kcal,1);
  const burned=sum(dayOr(k).runs,r=>r.kcal||0);
  const mac=(lbl,v,tg,col)=>`<div class="macro"><div class="k"><i style="background:${col}"></i>${lbl}</div>
    <div class="v num">${fmt(v)}<span> / ${fmt(tg)} g</span></div><div class="bar thin"><i style="width:${tg?clamp(v/tg*100,0,100):0}%;background:${col}"></i></div></div>`;

function goalLine(cur,g,rate){const [a,b]=goalText(cur,g,rate).split(', around ');

function goalText(cur,goal,rate){const diff=cur-goal;if(Math.abs(diff)<.05)return 'Reached';

/* ---------- Progress ---------- */
const RANGES={'30D':30,'90D':90,'1Y':365,'All':3650};

    h+=`<div class="stats">${stat('Trend',fmt(U.w(lastT),1),U.wL())}${stat('Change',signed(U.w(chg),1),U.wL(),null)}${stat('Per week',rate==null?DASH:signed(U.w(rate),2),rate==null?'':U.wL())}</div>
      ${lineChart({id:'w',points:wi.map(p=>({x:daysBetween(start,p.k),y:U.w(p.w)})),trend:tr,goal:g&&Math.abs(U.w(g)-U.w(lastT))<U.w(8)?U.w(g):null,color:'var(--acc)',xMin:0,xMax:span-1,
        xLabels:axisLabels(start,span),label:'Weight trend'})}

    <div class="stats">${stat('Daily average',fmt(avgK),'kcal')}${stat('Protein',fmt(avgP),'g')}${stat('On target',logged.length?Math.round(onT/logged.length*100)+'%':DASH,'',logged.length?'within 10%':null)}</div>`;
  if(!logged.length)h+=`<div class="empty-chart">Log food on a few days to see intake against your target. Today is left out until it's done.</div>`;
  else h+=barChart({vals:buckets(days,span,k=>dayOr(k).food.length&&k!==t?macros(k).kcal:null,true).map(b=>({v:b.v||0,label:b.label,hi:true,col:b.v!=null&&b.v>tk*1.1?'var(--neg)':null,tip:b.v!=null?`${fmt(b.v)} kcal<small>${b.tip}</small>`:`No data<small>${b.tip}</small>`})),

  else h+=barChart({vals:weeks.map(m=>{const v=U.d(sum(runs.filter(r=>r._k>=m&&r._k<addDays(m,7)),r=>r.dist));return {v,label:wkN<=8?shortDate(m).split(' ')[1]:'',hi:m===monday(t),tip:`${fmt(v,1)} ${U.dL()}<small>Week of ${shortDate(m)}</small>`};}),color:'var(--acc)',h:100,dec:0,label:'Distance per week'});
  h+='</div></section>';

function axisLabels(start,span){const out=[];const n=3;for(let i=0;i<n;i++){const x=Math.round((span-1)*i/(n-1));out.push({x,t:shortDate(addDays(start,x)),anchor:i===0?'start':i===n-1?'end':'middle'});}return out;}
/* daily bars up to 31 days, weekly averages beyond that */
function buckets(days,span,fn){if(span<=31)return days.map((k,i)=>({v:fn(k),label:span<=14?DAYS[parseKey(k).getDay()].slice(0,1):(i%7===0?String(parseKey(k).getDate()):''),tip:shortDate(k)}));
  const out=[];for(let i=0;i<days.length;i+=7){const ch=days.slice(i,i+7),vs=ch.map(fn).filter(v=>v!=null);
    out.push({v:vs.length?sum(vs)/vs.length:null,label:days.length<=120&&(i/7)%2===0?String(parseKey(ch[0]).getDate()):'',tip:'Week of '+shortDate(ch[0])+', avg'});}
  if(out.length>26){const m=[];for(let i=0;i<out.length;i+=4){const ch=out.slice(i,i+4),vs=ch.map(x=>x.v).filter(v=>v!=null);m.push({v:vs.length?sum(vs)/vs.length:null,label:'',tip:ch[0].tip.replace('Week','Month')});}return m;}
  return out;}
function topLifts(){const best={};allLogged('workouts').forEach(w=>(w.exercises||[]).forEach(e=>(e.sets||[]).forEach(s=>{const v=e1rm(s.w,s.r);if(v>(best[e.name]||0))best[e.name]=v;})));
  return Object.keys(best).map(n=>({name:n,v:best[n]})).sort((a,b)=>b.v-a.v);}

function logFood(k,meal,food,qty,entry){const d=day(k,true),mm=foodMacros(food,qty);
