function searchSheet(){const run=q=>{q=q.trim().toLowerCase();if(!q)return '<div class="empty">Search foods, workouts, exercises, runs, notes and history</div>';
  const foods=S.foods.filter(f=>f.name.toLowerCase().includes(q)).slice(0,6),wos=S.workouts.filter(w=>w.name.toLowerCase().includes(q)||w.exercises.some(e=>e.name.toLowerCase().includes(q))).slice(0,6),hist=[];
  Object.keys(S.log).sort().reverse().forEach(k=>{if(hist.length>16)return;const d=S.log[k];
    (d.food||[]).forEach(f=>{if(f.name.toLowerCase().includes(q))hist.push([k,'Nutrition',f.name]);});
    (d.workouts||[]).forEach(w=>{const ex=w.exercises.find(e=>e.name.toLowerCase().includes(q));if(w.name.toLowerCase().includes(q)||ex)hist.push([k,'Workout',ex?ex.name+' · top '+fmt(U.w(Math.max(...ex.sets.map(s=>s.w))),1)+' '+U.wL():w.name]);});
    (d.runs||[]).forEach(r=>{if(r.type.toLowerCase().includes(q)||(r.note||'').toLowerCase().includes(q))hist.push([k,'Run',fmt(U.d(r.dist),2)+' '+U.dL()+' '+r.type]);});
    if(d.note&&d.note.toLowerCase().includes(q))hist.push([k,'Note',d.note.slice(0,70)]);});
  const grp=(t,rows)=>rows.length?`<div class="lab" style="margin-top:10px">${t}</div><div class="list">${rows}</div>`:'';
  return (grp('Foods',foods.map(f=>`<button class="lrow tap" data-sf="${f.id}" style="width:100%;text-align:left"><div class="grow"><div class="t">${esc(f.name)}</div><div class="s">${f.serving}${esc(f.unit)} · ${fmt(f.kcal)} kcal</div></div><span class="badge">Log</span></button>`).join(''))
    +grp('Workouts',wos.map(w=>`<button class="lrow tap" data-sw="${w.id}" style="width:100%;text-align:left"><div class="grow"><div class="t">${esc(w.name)}</div><div class="s">${w.exercises.length} exercises</div></div><span class="chev">${I.chev}</span></button>`).join(''))
    +grp('History',hist.map(([k,t,s])=>`<button class="lrow tap" data-sh="${k}" style="width:100%;text-align:left"><div class="grow"><div class="t">${esc(s)}</div><div class="s">${t} · ${relDay(k)}</div></div><span class="chev">${I.chev}</span></button>`).join('')))||'<div class="empty">No matches</div>';};
  openSheet({title:'Search',full:true,body:`<input class="input" id="sq" placeholder="Search everything" autocomplete="off" type="search"><div id="sr">${run('')}</div>`,
    onMount:(el,close)=>{const i=$('#sq',el);setTimeout(()=>i.focus(),380);i.addEventListener('input',()=>$('#sr',el).innerHTML=run(i.value));
      el.addEventListener('click',ev=>{const f=ev.target.closest('[data-sf]');if(f)return next(close,()=>qtySheet(UI.date,null,foodById(f.dataset.sf)));
        const w=ev.target.closest('[data-sw]');if(w)return next(close,()=>workoutPreview(w.dataset.sw));
        const h=ev.target.closest('[data-sh]');if(h){UI.date=h.dataset.sh;close();go('today');}});}});}

function ensureHabit(name,def){let h=S.habits.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!h){h=Object.assign({id:uid(),name,on:true},def);S.habits.push(h);}else h.on=true;return h;}

  const sleep=ensureHabit('Sleep',{type:'number',unit:'h',dec:1,target:7,presets:[6,7,8],step:.5});
  const grow=ensureHabit('Growth',{type:'number',unit:'h',dec:1,target:2,presets:[1,2,3],step:.5});
  return {id:uid(),name:'80 Day Challenge',start:'2026-09-14',days:80,pillars:[
    {id:uid(),name:'CFA L2',src:'habit',habitId:cfa.id},{id:uid(),name:'Sleep',src:'habit',habitId:sleep.id,min:7},
    {id:uid(),name:'Lift',src:'workout'},{id:uid(),name:'Run',src:'run'},{id:uid(),name:'Grow',src:'habit',habitId:grow.id},{id:uid(),name:'Track',src:'food'}]};}

    grid+=`<b class="${k===t?'today':''} ${fut?'fut':''}" style="${f?`background:rgba(var(--acc),${f===1?1:(.15+f*.45).toFixed(2)})`:''}" title="Day ${i+1}">${i+1}</b>`;}
  openSheet({title:c.name,full:true,body:`
    <div class="grid2">${statTile('Day',Math.min(c.days,Math.max(0,chalDay(t)))+' of '+c.days)}${statTile('Perfect days',st.perfectDays)}${statTile('Current streak',st.streak+' days')}${statTile('Pillars hit',Math.round(st.rate*100)+'%')}</div>

    <div class="lab">Pillars</div><div class="list">${c.pillars.map(p=>{const hb=p.src==='habit'&&S.habits.find(h=>h.id===p.habitId),hit=Array.from({length:st.upto},(_,i)=>pillarMet(p,addDays(c.start,i))).filter(Boolean).length;

function challengeSetupSheet(existing){const c=existing?JSON.parse(JSON.stringify(existing)):{id:uid(),name:'',start:todayKey(),days:75,pillars:[]};
